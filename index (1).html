<!DOCTYPE html>
<html lang="fr" class="anti-cadre" data-theme="clair">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-OKWVD+5CBzLeXGjQ8tJgz5EOCh4w1tnFMWsKuUbuWmU=' https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js https://cdnjs.cloudflare.com/ajax/libs/echarts/6.1.0/echarts.min.js; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">

<style>
/* =====================================================================
   DESIGN SYSTEM · écrit une seule fois, réutilisé partout
   Couleurs · tailles de texte · espacements (échelle de 8 px) · rayons · ombres
   ===================================================================== */
:root {
  /* Espacements : échelle de 8 px */
  --e05: 4px; --e1: 8px; --e2: 16px; --e3: 24px; --e4: 32px; --e5: 40px; --e6: 48px; --e8: 64px;
  /* Rayons des coins */
  --r1: 8px; --r2: 16px; --r3: 24px; --r-pilule: 999px;
  /* Échelle typographique fixe */
  --t-titre: 40px; --t-sous-titre: 24px; --t-chiffre: 56px; --t-texte: 16px; --t-legende: 13px;
  /* Polices : 2 au maximum */
  --police-titre: "Cinzel", "Trajan Pro", "Times New Roman", serif;
  --police-texte: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  /* Mouvement */
  --duree: 200ms; --courbe: cubic-bezier(.2, .7, .2, 1);
  /* Gabarit */
  --rail: 80px; --menu: 312px; --bande-mobile: 52px; --barre-onglets: 68px;
  /* Flou du verre dépoli */
  --flou: blur(20px) saturate(150%);
}

/* Mode clair (par défaut) : ivoire, grenat et or */
[data-theme="clair"] {
  --fond: #F6EFE3;
  --carte: rgba(255, 251, 244, .68);
  --carte-forte: rgba(255, 251, 244, .92);
  --carte-survol: rgba(255, 251, 244, .82);
  --bord: rgba(79, 0, 0, .14);
  --bord-fort: rgba(79, 0, 0, .28);
  --texte: #2A0707;
  --texte-2: #5B3A31;
  --principale: #4F0000;
  --sur-principale: #FFF6E3;
  --accent: #F5C971;
  --accent-texte: #7A4D00;
  --sur-accent: #2A0707;
  --ombre: 0 8px 32px rgba(79, 0, 0, .10), 0 1px 2px rgba(79, 0, 0, .06);
  --ombre-forte: 0 16px 48px rgba(79, 0, 0, .18);
  --vert: #1B7347; --orange: #9A4F00; --rouge: #B01E1A; --bleu: #1F5FC4; --gris: #6B5D57;
  --piste-off: #B8ABA2;
  --squelette-1: rgba(79, 0, 0, .06); --squelette-2: rgba(79, 0, 0, .12);
  --serie-1: #4F0000; --serie-2: #C9A24B; --serie-3: #9A6A1E; --serie-4: #C2551F; --serie-5: #8E0F14;
  --grille: rgba(79, 0, 0, .10);
}

/* Mode sombre : la palette personnalisée (noir, grenat, or, blanc) */
[data-theme="sombre"] {
  --fond: #000000;
  --carte: rgba(79, 0, 0, .42);
  --carte-forte: rgba(40, 0, 0, .94);
  --carte-survol: rgba(79, 0, 0, .56);
  --bord: rgba(245, 201, 113, .18);
  --bord-fort: rgba(245, 201, 113, .36);
  --texte: #F5C971;
  --texte-2: #D9B979;
  --principale: #FFFFFF;
  --sur-principale: #2A0000;
  --accent: #F5C971;
  --accent-texte: #F5C971;
  --sur-accent: #1A0000;
  --ombre: 0 8px 40px rgba(0, 0, 0, .55), 0 1px 2px rgba(0, 0, 0, .4);
  --ombre-forte: 0 18px 56px rgba(0, 0, 0, .7);
  --vert: #57C98F; --orange: #F2A65A; --rouge: #FF7272; --bleu: #8DB8FF; --gris: #B5A58A;
  --piste-off: #5E4B3B;
  --squelette-1: rgba(245, 201, 113, .06); --squelette-2: rgba(245, 201, 113, .14);
  --serie-1: #FFFFFF; --serie-2: #F5C971; --serie-3: #D99A3A; --serie-4: #E0663A; --serie-5: #C2202B;
  --grille: rgba(245, 201, 113, .12);
}

/* =====================================================================
   BASE
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* Protection anti-cadre : rien n'est visible tant que le script n'a pas vérifié la page */
html.anti-cadre body { visibility: hidden; }
html.dans-cadre body { display: none !important; }
body {
  margin: 0; min-height: 100vh; overflow-x: hidden;
  font-family: var(--police-texte); font-weight: 300; font-size: var(--t-texte); line-height: 1.5;
  color: var(--texte); background: var(--fond);
  font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
  -webkit-font-smoothing: antialiased;
}
#fond { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
h1, h2, h3 { font-family: var(--police-titre); font-weight: 400; margin: 0; letter-spacing: .02em; }
h1 { font-size: var(--t-titre); line-height: 1.15; color: var(--principale); }
h2 { font-size: var(--t-sous-titre); line-height: 1.25; color: var(--principale); }
h3 { font-size: var(--t-texte); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--texte-2); font-family: var(--police-texte); }
p { margin: 0; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.chiffre { font-variant-numeric: tabular-nums; }
.legende { font-size: var(--t-legende); color: var(--texte-2); font-weight: 400; }
.masque-visuel { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
svg.icone { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* Contour visible sur l'élément actif (clavier) */
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: var(--r1); box-shadow: 0 0 0 5px color-mix(in srgb, var(--principale) 35%, transparent); }

.lien-evitement { position: fixed; left: var(--e2); top: -100px; z-index: 100; padding: var(--e1) var(--e2); background: var(--accent); color: var(--sur-accent); border-radius: var(--r1); font-weight: 500; text-decoration: none; }
.lien-evitement:focus { top: var(--e2); }

/* =====================================================================
   VERRE DÉPOLI (glassmorphism)
   ===================================================================== */
.verre {
  background: var(--carte);
  -webkit-backdrop-filter: var(--flou); backdrop-filter: var(--flou);
  border: 1px solid var(--bord); border-radius: var(--r3); box-shadow: var(--ombre);
}

/* =====================================================================
   GABARIT : menu en rail qui s'ouvre au survol, contenu, barres mobiles
   ===================================================================== */
.app { position: relative; z-index: 1; min-height: 100vh; }
.menu {
  position: fixed; z-index: 30; top: var(--e2); bottom: var(--e2); left: var(--e2);
  width: var(--rail); display: flex; flex-direction: column; gap: var(--e1);
  padding: var(--e2) var(--e1); overflow: hidden;
  transition: width 260ms var(--courbe), box-shadow 260ms var(--courbe);
}
.menu:hover, .menu:focus-within, .menu.ouvert { width: var(--menu); box-shadow: var(--ombre-forte); background: var(--carte-forte); }
.menu-defilement { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: var(--e05); scrollbar-width: thin; }
.marque { display: flex; align-items: center; gap: var(--e2); padding: 0 var(--e1) var(--e2); min-height: 56px; text-decoration: none; }
.monogramme {
  flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--police-titre); font-weight: 600; font-size: 17px; letter-spacing: .04em;
  color: var(--sur-principale); background: var(--principale); border: 1px solid var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
}
.marque-texte { white-space: nowrap; overflow: hidden; }
.marque-texte strong { display: block; font-family: var(--police-titre); font-weight: 500; font-size: 17px; color: var(--principale); }
.marque-texte span { font-size: var(--t-legende); color: var(--texte-2); }
.titre-section { padding: var(--e2) var(--e2) var(--e05); font-size: var(--t-legende); letter-spacing: .12em; text-transform: uppercase; color: var(--texte-2); white-space: nowrap; font-weight: 400; }
.lien-menu {
  position: relative; display: flex; align-items: center; gap: var(--e2); min-height: 48px; padding: var(--e1) var(--e2);
  border-radius: var(--r2); text-decoration: none; white-space: nowrap; color: var(--texte); font-weight: 400;
  transition: background var(--duree) var(--courbe), color var(--duree) var(--courbe);
}
.lien-menu:hover { background: color-mix(in srgb, var(--principale) 8%, transparent); }
.lien-menu[aria-current="page"] { background: var(--principale); color: var(--sur-principale); }
.lien-menu[aria-current="page"] .pastille { background: color-mix(in srgb, var(--sur-principale) 16%, transparent); color: var(--sur-principale); border-color: transparent; }
.lien-menu .libelle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.lien-menu .sous { font-size: var(--t-legende); color: inherit; opacity: .8; }
.lien-menu .libelle-multi { white-space: normal; line-height: 1.3; }
.nom-bu { display: block; }
.ligne-sous { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.menu:not(:hover):not(:focus-within):not(.ouvert) .ligne-sous .pastille { display: none; }
.tiroir .point-statut { display: none; }
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { outline: none; box-shadow: none; }
.initiales { flex: none; width: 32px; height: 32px; margin-left: -4px; border-radius: 10px; display: grid; place-items: center; font-size: 12px; font-weight: 500; letter-spacing: .04em; border: 1px solid var(--bord-fort); }
.point-statut { position: absolute; left: 38px; top: 10px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--fond); }
.ligne-bu { display: flex; align-items: center; gap: 2px; }
.ligne-bu .lien-menu { flex: 1; min-width: 0; }
.deplier { flex: none; width: 36px; height: 36px; border: 0; border-radius: var(--r1); background: transparent; display: grid; place-items: center; color: var(--texte-2); }
.deplier:hover { background: color-mix(in srgb, var(--principale) 8%, transparent); }
.deplier svg { transition: transform var(--duree) var(--courbe); }
.deplier[aria-expanded="true"] svg { transform: rotate(90deg); }
.liste-clients { list-style: none; margin: 0 0 var(--e1) 28px; padding: 0 0 0 var(--e1); border-left: 1px solid var(--bord); }
.liste-clients .lien-menu { min-height: 40px; padding: var(--e05) var(--e1) var(--e05) var(--e2); font-size: 14px; gap: var(--e1); }
/* En rail, on cache tout ce qui demande de la place */
.menu:not(:hover):not(:focus-within):not(.ouvert) .libelle,
.menu:not(:hover):not(:focus-within):not(.ouvert) .marque-texte,
.menu:not(:hover):not(:focus-within):not(.ouvert) .titre-section,
.menu:not(:hover):not(:focus-within):not(.ouvert) .deplier,
.menu:not(:hover):not(:focus-within):not(.ouvert) .liste-clients,
.menu:not(:hover):not(:focus-within):not(.ouvert) .lien-menu .pastille,
.menu:not(:hover):not(:focus-within):not(.ouvert) .pied-menu .libelle-bouton,
.menu:not(:hover):not(:focus-within):not(.ouvert) .panneau-complet { display: none; }
.menu:hover .panneau-rail, .menu:focus-within .panneau-rail, .menu.ouvert .panneau-rail { display: none; }
.menu:not(:hover):not(:focus-within):not(.ouvert) .titre-section { display: block; height: 1px; padding: 0; margin: var(--e1) var(--e2); background: var(--bord); font-size: 0; }
.menu .point-statut { display: none; }
.menu:not(:hover):not(:focus-within):not(.ouvert) .point-statut { display: block; }

.contenu { position: relative; z-index: 1; margin-left: calc(var(--rail) + var(--e2) * 2); padding: var(--e4) var(--e4) var(--e8); max-width: 1480px; }

/* =====================================================================
   PANNEAU DE SYNCHRONISATION
   ===================================================================== */
.panneau { border-top: 1px solid var(--bord); padding-top: var(--e2); margin-top: var(--e1); }
.panneau-complet { display: flex; flex-direction: column; gap: var(--e1); padding: 0 var(--e1); min-width: calc(var(--menu) - var(--e2) * 2); }
.panneau-entete { display: flex; align-items: center; justify-content: space-between; gap: var(--e1); }
.panneau-entete strong { font-weight: 500; font-size: 14px; letter-spacing: .04em; }
.panneau-infos { display: grid; grid-template-columns: auto 1fr; gap: 2px var(--e1); font-size: var(--t-legende); color: var(--texte-2); }
.panneau-infos dt { font-weight: 400; }
.panneau-infos dd { margin: 0; color: var(--texte); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panneau-boutons { display: flex; flex-direction: column; gap: var(--e1); }
.panneau-message { font-size: var(--t-legende); color: var(--texte-2); line-height: 1.4; }
.panneau-raison { font-size: var(--t-legende); color: var(--rouge); line-height: 1.4; font-weight: 400; }
.panneau-rail { display: flex; justify-content: center; }
.bouton-rail { position: relative; width: 48px; height: 48px; border-radius: var(--r2); border: 1px solid var(--bord); background: transparent; display: grid; place-items: center; }
.bouton-rail .point { position: absolute; right: 6px; top: 6px; }

/* Interrupteur « Synchronisation » : piste 44 × 24 px, rond qui glisse en 200 ms */
.interrupteur { display: inline-flex; align-items: center; gap: var(--e1); border: 0; background: none; padding: 4px; border-radius: var(--r-pilule); font-size: var(--t-legende); color: var(--texte-2); }
.interrupteur .piste { position: relative; width: 44px; height: 24px; border-radius: 12px; background: var(--piste-off); transition: background var(--duree) var(--courbe); flex: none; }
.interrupteur .rond { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.35); transition: transform var(--duree) var(--courbe); }
.interrupteur[aria-checked="true"] .piste { background: var(--principale); }
[data-theme="sombre"] .interrupteur[aria-checked="true"] .rond { background: #4F0000; }
.interrupteur[aria-checked="true"] .rond { transform: translateX(20px); }

/* Pastille d'état : toujours une couleur et un mot */
.etat { display: inline-flex; align-items: center; gap: var(--e1); font-size: var(--t-legende); font-weight: 400; line-height: 1.3; }
.point { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--gris); }
.etat-ok .point, .point.etat-ok { background: var(--vert); animation: pulsation 2.4s ease-in-out infinite; }
.etat-pause .point, .point.etat-pause, .etat-aucun .point, .point.etat-aucun, .etat-import .point, .point.etat-import { background: var(--gris); }
.etat-lecture .point, .point.etat-lecture { background: var(--bleu); animation: pulsation 1s ease-in-out infinite; }
.etat-reconnexion .point, .point.etat-reconnexion { background: var(--orange); }
.etat-erreur .point, .point.etat-erreur { background: var(--rouge); }
.etat-ok { color: var(--vert); } .etat-lecture { color: var(--bleu); } .etat-reconnexion { color: var(--orange); } .etat-erreur { color: var(--rouge); }
@keyframes pulsation { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 0%, transparent); opacity: 1; } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--vert) 25%, transparent); opacity: .75; } }

/* =====================================================================
   BOUTONS
   ===================================================================== */
.bouton { display: inline-flex; align-items: center; justify-content: center; gap: var(--e1); min-height: 40px; padding: var(--e1) var(--e2); border-radius: var(--r-pilule); border: 1px solid var(--bord-fort); background: transparent; font-size: 14px; font-weight: 400; letter-spacing: .02em; text-decoration: none; white-space: nowrap; transition: background var(--duree) var(--courbe), transform var(--duree) var(--courbe), box-shadow var(--duree) var(--courbe); }
.bouton:hover { background: color-mix(in srgb, var(--principale) 8%, transparent); }
.bouton-principal { border-color: transparent; color: var(--sur-accent); font-weight: 500; background: linear-gradient(135deg, #F8D68C, #F5C971 45%, #D9A646); box-shadow: 0 4px 18px color-mix(in srgb, var(--accent) 45%, transparent), inset 0 1px 0 rgba(255,255,255,.55); }
.bouton-principal:hover { background: linear-gradient(135deg, #FBE0A4, #F5C971 45%, #CF9A3A); transform: translateY(-1px); }
.bouton-discret { border-color: transparent; color: var(--texte-2); padding: var(--e05) var(--e1); min-height: 32px; font-size: var(--t-legende); }
.bouton-pleine-largeur { width: 100%; }
.bouton[disabled] { opacity: .5; cursor: not-allowed; }

/* Bouton de thème premium : soleil / lune qui glissent */
.bascule-theme { position: relative; display: inline-flex; align-items: center; gap: 0; width: 72px; height: 36px; padding: 3px; border-radius: var(--r-pilule); border: 1px solid var(--bord-fort); background: color-mix(in srgb, var(--principale) 6%, transparent); flex: none; }
.bascule-theme .curseur { position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #F8D68C, #D9A646); box-shadow: 0 2px 8px rgba(0,0,0,.25); transition: transform 260ms var(--courbe); }
[data-theme="sombre"] .bascule-theme .curseur { transform: translateX(36px); background: linear-gradient(135deg, #7A0A0A, #4F0000); border: 1px solid var(--accent); }
.bascule-theme svg { position: relative; z-index: 1; width: 16px; height: 16px; margin: 0 7px; }
.bascule-theme .soleil { color: #4F0000; } .bascule-theme .lune { color: var(--texte-2); }
[data-theme="sombre"] .bascule-theme .soleil { color: var(--texte-2); } [data-theme="sombre"] .bascule-theme .lune { color: #F5C971; }
.pied-menu { display: flex; align-items: center; gap: var(--e1); padding: var(--e1) var(--e1) 0; flex-wrap: wrap; justify-content: center; }
.menu:hover .pied-menu, .menu:focus-within .pied-menu, .menu.ouvert .pied-menu { justify-content: space-between; }

/* =====================================================================
   EN-TÊTE DE PAGE, FIL D'ARIANE, FILTRES
   ===================================================================== */
.entete { display: flex; flex-direction: column; gap: var(--e2); margin-bottom: var(--e4); }
.ariane ol { display: flex; flex-wrap: wrap; gap: var(--e1); list-style: none; margin: 0; padding: 0; font-size: var(--t-legende); color: var(--texte-2); }
.ariane li { display: inline-flex; align-items: center; gap: var(--e1); }
.ariane li + li::before { content: "›"; color: var(--accent-texte); }
.ariane a { text-decoration: none; border-bottom: 1px solid transparent; }
.ariane a:hover { border-bottom-color: currentColor; }
.ariane [aria-current="page"] { color: var(--texte); }
.titre-ligne { display: flex; flex-wrap: wrap; align-items: center; gap: var(--e2); }
.sous-titre { color: var(--texte-2); font-size: var(--t-texte); }
.filtres { display: flex; flex-wrap: wrap; align-items: center; gap: var(--e2); }
.segments { display: inline-flex; padding: 4px; gap: 4px; border-radius: var(--r-pilule); }
.segments button { min-height: 36px; padding: 0 var(--e2); border-radius: var(--r-pilule); border: 0; background: transparent; font-size: 14px; font-weight: 400; color: var(--texte-2); transition: background var(--duree) var(--courbe), color var(--duree) var(--courbe); }
.segments button[aria-checked="true"] { background: var(--principale); color: var(--sur-principale); }
.puce-info { display: inline-flex; align-items: center; gap: var(--e1); min-height: 36px; padding: 0 var(--e2); border-radius: var(--r-pilule); font-size: 14px; color: var(--texte-2); }
.puce-info strong { font-weight: 500; color: var(--texte); }

/* =====================================================================
   PASTILLES DE STATUT (couleur + icône + mot)
   ===================================================================== */
.pastille { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; border-radius: var(--r-pilule); font-size: var(--t-legende); font-weight: 500; line-height: 1.6; white-space: nowrap; border: 1px solid transparent; flex: none; }
.pastille svg.icone { width: 14px; height: 14px; stroke-width: 2; }
.pastille.vert { color: var(--vert); background: color-mix(in srgb, var(--vert) 13%, transparent); border-color: color-mix(in srgb, var(--vert) 30%, transparent); }
.pastille.orange { color: var(--orange); background: color-mix(in srgb, var(--orange) 13%, transparent); border-color: color-mix(in srgb, var(--orange) 30%, transparent); }
.pastille.rouge { color: var(--rouge); background: color-mix(in srgb, var(--rouge) 13%, transparent); border-color: color-mix(in srgb, var(--rouge) 30%, transparent); }

 * Création d'éléments sans HTML interprété : tout le texte passe par textContent / nœuds texte.
 * Les noms d'attributs viennent toujours du code, jamais du fichier.
 */
function el(balise, proprietes) {
  const noeud = document.createElement(balise);
  if (proprietes) {
    for (const cle of Object.keys(proprietes)) {
      const valeur = proprietes[cle];
      if (valeur === null || valeur === undefined || valeur === false) continue;
      if (cle === 'class') noeud.className = valeur;
      else if (cle === 'texte') noeud.textContent = String(valeur);
      else if (cle === 'style') Object.assign(noeud.style, valeur);
      else if (cle === 'dataset') Object.assign(noeud.dataset, valeur);
      else if (cle.slice(0, 2) === 'on' && typeof valeur === 'function') noeud.addEventListener(cle.slice(2), valeur);
      else noeud.setAttribute(cle, valeur === true ? '' : String(valeur));
    }
  }
  for (let i = 2; i < arguments.length; i++) ajouterEnfant(noeud, arguments[i]);
  return noeud;
}
function ajouterEnfant(parent, enfant) {
  if (enfant === null || enfant === undefined || enfant === false) return;
  if (Array.isArray(enfant)) { for (const e of enfant) ajouterEnfant(parent, e); return; }
  if (enfant instanceof Node) parent.appendChild(enfant);
  else parent.appendChild(document.createTextNode(String(enfant)));
}

/** IndexedDB : on garde la poignée du fichier, jamais son contenu. */
const BASE_IDB = 'creances-poignees';
function ouvrirBase() {
  return new Promise(function (resoudre, rejeter) {
    if (!window.indexedDB) { rejeter(new Error('indisponible')); return; }
    let req;
    try { req = window.indexedDB.open(BASE_IDB, 1); } catch (e) { rejeter(e); return; }
    req.onupgradeneeded = function () { req.result.createObjectStore('poignees'); };
    req.onsuccess = function () { resoudre(req.result); };
    req.onerror = function () { rejeter(req.error); };
  });
}
async function idbOperation(mode, action) {
  const base = await ouvrirBase();
  try {
    return await new Promise(function (resoudre, rejeter) {
      const tx = base.transaction('poignees', mode);
      const store = tx.objectStore('poignees');
      let req;
      try { req = action(store); } catch (e) { rejeter(e); return; }
      tx.oncomplete = function () { resoudre(req ? req.result : undefined); };
      tx.onerror = function () { rejeter(tx.error); };
      tx.onabort = function () { rejeter(tx.error); };
    });
  } finally { base.close(); }
}
async function idbLirePoignee() { try { return await idbOperation('readonly', function (s) { return s.get('fichier'); }); } catch (e) { return null; } }

/** Empreinte SHA-256 (Web Crypto), avec repli si le contexte n'est pas sécurisé. */
async function empreinte(donnees) {
  const octets = typeof donnees === 'string' ? new TextEncoder().encode(donnees) : new Uint8Array(donnees);
  if (window.crypto && window.crypto.subtle) {
    try {
      const h = await window.crypto.subtle.digest('SHA-256', octets);
      return Array.from(new Uint8Array(h), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    } catch (e) { /* repli ci-dessous */ }
  }
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < octets.length; i++) { h1 = Math.imul(h1 ^ octets[i], 16777619); h2 = Math.imul(h2 + octets[i], 2246822507); }
  return 'fnv-' + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16) + '-' + octets.length;
}

/** Normalise un nom : sans accents, sans majuscules, sans ponctuation, espaces simplifiés. */
function normaliser(texte) {
  return String(texte === null || texte === undefined ? '' : texte)
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[’'`´]/g, ' ')
    .replace(/[^a-z0-9%>]+/g, ' ').trim();
}
function extensionDe(nom) {
  const m = /\.[a-z0-9]+$/i.exec(String(nom || ''));
  return m ? m[0].toLowerCase() : '';
}
function formaterMo(octets) { return new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(octets / 1048576) + ' Mo'; }

/** Contrôle avant lecture : extension, taille, signature réelle du fichier. */
function controlerFichier(tampon, nom) {
  const ext = extensionDe(nom);
  if (CONFIG.extensions.indexOf(ext) < 0) {
    return { ok: false, message: 'Format refusé (' + (ext || 'sans extension') + ') : seuls les fichiers .xlsx, .xlsm, .xls et .csv sont acceptés.' };
  }
  const taille = tampon.byteLength;
  if (taille > CONFIG.tailleMax) return { ok: false, message: 'Le fichier pèse ' + formaterMo(taille) + ' : la taille maximale acceptée est de 10 Mo.' };
  if (taille === 0) return { ok: false, message: 'Le fichier est vide.' };
  const t = new Uint8Array(tampon, 0, Math.min(4096, taille));
  const zip = taille >= 4 && t[0] === 0x50 && t[1] === 0x4B && t[2] === 0x03 && t[3] === 0x04;
  const ole = taille >= 8 && [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1].every(function (b, i) { return t[i] === b; });
  if (ext === '.xlsx' || ext === '.xlsm') {
    if (!zip) return { ok: false, message: 'Ce fichier porte l\'extension ' + ext + ' mais ce n\'est pas un vrai classeur Excel : il a été refusé.' };
    return { ok: true, type: 'excel' };
  }
  if (ext === '.xls') {
    if (!zip && !ole) return { ok: false, message: 'Ce fichier porte l\'extension .xls mais ce n\'est pas un vrai classeur Excel : il a été refusé.' };
    return { ok: true, type: 'excel' };
  }
  if (zip || ole) return { ok: false, message: 'Ce fichier .csv est en réalité un fichier binaire : il a été refusé.' };
  for (let i = 0; i < t.length; i++) if (t[i] === 0) return { ok: false, message: 'Ce fichier .csv contient des données binaires : il a été refusé.' };
  return { ok: true, type: 'csv' };
}
function controlerNomEtTaille(nom, taille) {
  const ext = extensionDe(nom);
  if (CONFIG.extensions.indexOf(ext) < 0) return 'Format refusé (' + (ext || 'sans extension') + ') : seuls les fichiers .xlsx, .xlsm, .xls et .csv sont acceptés.';
  if (taille > CONFIG.tailleMax) return 'Le fichier pèse ' + formaterMo(taille) + ' : la taille maximale acceptée est de 10 Mo.';
  return null;
}

const MOTIF_ERREUR_EXCEL = /^#(N\/A|NA|DIV\/0!|VALEUR!|VALUE!|REF!|NOM\?|NAME\?|NUM!|NULL!|NUL!|CALC!|SPILL!|EPARS!)$/i;

/** Lecture d'un classeur Excel avec SheetJS : valeurs seulement, aucune macro exécutée. */
function lireClasseurExcel(tampon) {
  if (!window.XLSX || typeof window.XLSX.read !== 'function') throw erreurUtilisateur('Le module de lecture Excel n\'est pas chargé : vérifiez votre connexion Internet puis réessayez.');
  let classeur;
  try {
    classeur = window.XLSX.read(new Uint8Array(tampon), {
      type: 'array', cellFormula: true, cellHTML: false, cellNF: false, cellStyles: false, cellText: false,
      cellDates: false, bookVBA: false, bookFiles: false, bookDeps: false, sheetStubs: false, WTF: false,
      sheetRows: CONFIG.lignesMax + 20
    });
  } catch (e) {
    throw erreurUtilisateur('Le fichier est illisible ou abîmé : ce n\'est peut-être pas un vrai classeur Excel.');
  }
  if (!classeur || !Array.isArray(classeur.SheetNames) || !classeur.Sheets) throw erreurUtilisateur('Le fichier ne contient aucun onglet lisible.');
  const feuilles = [];
  for (const nom of classeur.SheetNames.slice(0, 60)) {
    const ws = classeur.Sheets[nom];
    if (!ws) continue;
    if (ws['!fullref']) {
      const complet = window.XLSX.utils.decode_range(ws['!fullref']);
      if (complet.e.r + 1 > CONFIG.lignesMax + 20) throw erreurUtilisateur('L\'onglet « ' + nom + ' » dépasse ' + new Intl.NumberFormat('fr-FR').format(CONFIG.lignesMax) + ' lignes : le fichier a été refusé.');
    }
    feuilles.push(grilleDepuisFeuille(String(nom), ws));
  }
  return { feuilles: feuilles };
}

/** Transforme un onglet SheetJS en grille de valeurs (null = vide). */
function grilleDepuisFeuille(nom, ws) {
  const grille = { nom: nom, lignes: [], erreurs: new Set(), formulesVides: new Set() };
  if (!ws['!ref']) return grille;
  const plage = window.XLSX.utils.decode_range(ws['!ref']);
  const derniereLigne = Math.min(plage.e.r, CONFIG.lignesMax + 20);
  const derniereColonne = Math.min(plage.e.c, CONFIG.colonnesMax - 1);
  for (let r = 0; r <= derniereLigne; r++) {
    const ligne = new Array(derniereColonne + 1).fill(null);
    if (r >= plage.s.r) {
      for (let c = plage.s.c; c <= derniereColonne; c++) {
        const cellule = ws[window.XLSX.utils.encode_cell({ r: r, c: c })];
        if (!cellule) continue;
        if (cellule.t === 'e') { grille.erreurs.add(r + ',' + c); continue; }
        if (cellule.v === undefined || cellule.v === null || cellule.t === 'z') {
          if (cellule.f) grille.formulesVides.add(r + ',' + c);
          continue;
        }
        if (typeof cellule.v === 'string' && MOTIF_ERREUR_EXCEL.test(cellule.v.trim())) { grille.erreurs.add(r + ',' + c); continue; }
        ligne[c] = cellule.v;
      }
    }
    grille.lignes.push(ligne);
  }
  return grille;
}

/** Lecture d'un CSV : séparateur ; ou , détecté, UTF-8 ou Windows-1252. */
function lireCSV(tampon) {
  let texte;
  try { texte = new TextDecoder('utf-8', { fatal: true }).decode(tampon); }
  catch (e) { texte = new TextDecoder('windows-1252').decode(tampon); }
  texte = texte.replace(/^﻿/, '');
  const echantillon = texte.split(/\r?\n/).slice(0, 12).join('\n');
  const compter = function (car) { let n = 0, guillemets = false; for (const ch of echantillon) { if (ch === '"') guillemets = !guillemets; else if (ch === car && !guillemets) n++; } return n; };
  const candidats = [[';', compter(';')], [',', compter(',')], ['\t', compter('\t')]].sort(function (a, b) { return b[1] - a[1]; });
  const sep = candidats[0][1] > 0 ? candidats[0][0] : ';';
  const grille = { nom: 'Data', lignes: [], erreurs: new Set(), formulesVides: new Set() };
  let ligne = [], champ = '', guillemets = false;
  const finChamp = function () {
    const v = champ.trim();
    const c = ligne.length;
    if (MOTIF_ERREUR_EXCEL.test(v)) { grille.erreurs.add(grille.lignes.length + ',' + c); ligne.push(null); }
    else ligne.push(v === '' ? null : v);
    champ = '';
  };
  const finLigne = function () {
    finChamp();
    grille.lignes.push(ligne.slice(0, CONFIG.colonnesMax));
    ligne = [];
    if (grille.lignes.length > CONFIG.lignesMax + 20) throw erreurUtilisateur('Le fichier dépasse ' + new Intl.NumberFormat('fr-FR').format(CONFIG.lignesMax) + ' lignes : il a été refusé.');
  };
  for (let i = 0; i < texte.length; i++) {
    const ch = texte[i];
    if (guillemets) {
      if (ch === '"') { if (texte[i + 1] === '"') { champ += '"'; i++; } else guillemets = false; }
      else champ += ch;
    } else if (ch === '"') guillemets = true;
    else if (ch === sep) finChamp();
    else if (ch === '\n') finLigne();
    else if (ch === '\r') { if (texte[i + 1] !== '\n') finLigne(); }
    else champ += ch;
  }
  if (champ !== '' || ligne.length) finLigne();
  return { feuilles: [grille] };
}

/** Lecture des nombres : « 1 234,56 », « 1,234.56 », « (1 234) », « 12 % », « 1 234 MAD ». */
function lireNombre(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : NaN;
  if (typeof v === 'boolean') return NaN;
  let s = String(v).trim();
  if (!s) return null;
  let negatif = false;
  if (/^\(.*\)$/.test(s)) { negatif = true; s = s.slice(1, -1); }
  s = s.replace(/[\s   ]/g, '').replace(/(MAD|DHS?|€|\$|EUR)/gi, '').replace(/[−–—]/g, '-');
  let pourcentage = false;
  if (s.slice(-1) === '%') { pourcentage = true; s = s.slice(0, -1); }
  if (s[0] === '-') { negatif = !negatif; s = s.slice(1); } else if (s[0] === '+') s = s.slice(1);
  const virgule = s.lastIndexOf(','), point = s.lastIndexOf('.');
  if (virgule >= 0 && point >= 0) {
    s = virgule > point ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  } else if (virgule >= 0) {
    const morceaux = s.split(',');
    s = morceaux.length > 2 ? morceaux.join('') : s.replace(',', '.');
  } else if (point >= 0) {
    const morceaux = s.split('.');
    if (morceaux.length > 2) s = morceaux.join('');
  }
  if (!/^(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
  let n = parseFloat(s);
  if (pourcentage) n = n / 100;
  return negatif ? -n : n;
}

/** Lecture des dates : date Excel, jj/mm/aaaa ou aaaa-mm-jj. Résultat : millisecondes UTC à minuit. */
function lireDate(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') {
    if (!isFinite(v) || v < 1 || v > 2958465) return NaN;
    return Math.round((Math.floor(v + 1e-7) - 25569)) * JOUR_MS;
  }
  if (v instanceof Date) return isNaN(v.getTime()) ? NaN : Date.UTC(v.getFullYear(), v.getMonth(), v.getDate());
  const s = String(v).trim();
  let m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/.exec(s);
  let a, mo, j;
  if (m) { j = +m[1]; mo = +m[2]; a = +m[3]; }
  else {
    m = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ].*)?$/.exec(s);
    if (!m) return NaN;
    a = +m[1]; mo = +m[2]; j = +m[3];
  }
  const t = Date.UTC(a, mo - 1, j);
  const d = new Date(t);
  if (d.getUTCFullYear() !== a || d.getUTCMonth() !== mo - 1 || d.getUTCDate() !== j) return NaN;
  return t;
}
function lireTexte(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).replace(/[\u0000-\u001F\u007F]/g, ' ').trim();
  return s === '' ? null : s.slice(0, 200);
}
function convertir(v, type) {
  if (type === 'nombre') return lireNombre(v);
  if (type === 'taux') { const n = lireNombre(v); return (typeof n === 'number' && isFinite(n) && Math.abs(n) > 1) ? n / 100 : n; }
  if (type === 'date') return lireDate(v);
  return lireTexte(v);
}
function estVide(v) { return v === null || v === undefined || (typeof v === 'string' && v.trim() === ''); }

/** Découpe une ligne d'en-têtes en blocs de cellules contiguës (plusieurs tableaux côte à côte). */
function blocsDeLigne(ligne) {
  const blocs = [];
  let courant = null;
  for (let c = 0; c < ligne.length; c++) {
    if (!estVide(ligne[c])) {
      if (!courant) { courant = { debut: c, fin: c }; blocs.push(courant); } else courant.fin = c;
    } else courant = null;
  }
  if (blocs.length > 1) blocs.push({ debut: blocs[0].debut, fin: blocs[blocs.length - 1].fin, entier: true });
  return blocs;
}

/** Associe les colonnes attendues aux en-têtes d'un bloc (nom exact = 2 points, synonyme = 1 point). */
function associerColonnes(spec, ligne, bloc) {
  const colonnes = new Map();
  const utilisees = new Set();
  const interdites = [];
  const normalises = new Map();
  for (let c = bloc.debut; c <= bloc.fin; c++) {
    const brut = lireTexte(ligne[c]);
    if (brut === null) continue;
    if (NOMS_INTERDITS.has(brut.toLowerCase())) { interdites.push(brut); continue; }
    normalises.set(c, normaliser(brut));
  }
  let score = 0, trouvees = 0, obligatoiresTrouvees = 0;
  const manquantes = [];
  for (const col of spec.colonnes) {
    const nomExact = normaliser(col.nom);
    const synonymes = col.synonymes.map(normaliser);
    let indice = -1, points = 0;
    for (const [c, n] of normalises) { if (!utilisees.has(c) && n === nomExact) { indice = c; points = 2; break; } }
    if (indice < 0) for (const [c, n] of normalises) { if (!utilisees.has(c) && synonymes.indexOf(n) >= 0) { indice = c; points = 1; break; } }
    if (indice >= 0) { colonnes.set(col.cle, indice); utilisees.add(indice); score += points; trouvees++; if (col.obligatoire) obligatoiresTrouvees++; }
    else if (col.obligatoire) manquantes.push(col.nom);
  }
  return { colonnes: colonnes, score: score - (bloc.entier ? 0.5 : 0), trouvees: trouvees, obligatoiresTrouvees: obligatoiresTrouvees, manquantes: manquantes, complet: manquantes.length === 0, interdites: interdites };
}

/** Cherche un tableau (ligne d'en-têtes dans les 10 premières lignes) dans tous les onglets. */
function trouverTableau(classeur, spec, exclure) {
  const prefere = spec.onglets.map(normaliser);
  const feuilles = classeur.feuilles.slice().sort(function (a, b) {
    const ia = prefere.indexOf(normaliser(a.nom)), ib = prefere.indexOf(normaliser(b.nom));
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  let meilleur = null, partiel = null;
  for (const feuille of feuilles) {
    const limite = Math.min(feuille.lignes.length, 10);
    for (let r = 0; r < limite; r++) {
      const ligne = feuille.lignes[r];
      if (!ligne) continue;
      for (const bloc of blocsDeLigne(ligne)) {
        if (exclure && exclure.feuille === feuille && exclure.ligne === r && !(bloc.fin < exclure.bloc.debut || bloc.debut > exclure.bloc.fin)) continue;
        const a = associerColonnes(spec, ligne, bloc);
        if (a.complet) {
          if (!meilleur || a.score > meilleur.score) meilleur = Object.assign(a, { feuille: feuille, ligneEntete: r, bloc: bloc });
        } else if (a.obligatoiresTrouvees >= 2 && (!partiel || a.obligatoiresTrouvees > partiel.obligatoiresTrouvees)) {
          partiel = Object.assign(a, { feuille: feuille, ligneEntete: r, bloc: bloc });
        }
      }
    }
  }
  if (meilleur) return Object.assign({ ok: true }, meilleur);
  if (partiel) {
    const autres = partiel.manquantes.length - 1;
    return {
      ok: false, partiel: true, onglet: partiel.feuille.nom, colonne: partiel.manquantes[0],
      message: 'La colonne « ' + partiel.manquantes[0] + ' » est introuvable dans l\'onglet « ' + partiel.feuille.nom + ' » (tableau ' + spec.titre + ')' +
        (autres > 0 ? ', ainsi que : ' + partiel.manquantes.slice(1).map(function (n) { return '« ' + n + ' »'; }).join(', ') : '') +
        '. Vérifiez le nom exact dans la ligne d\'en-têtes.'
    };
  }
  return { ok: false, partiel: false, onglet: spec.onglets[0], message: 'L\'onglet « ' + spec.onglets[0] + ' » (tableau ' + spec.titre + ') est introuvable, ou sa ligne d\'en-têtes n\'est pas dans les 10 premières lignes.' };
}

/** Extrait les enregistrements d'un tableau trouvé, en tolérant lignes vides et lignes « Total ». */
function extraireEnregistrements(tableau, spec, alertes) {
  const feuille = tableau.feuille;
  const enregistrements = [];
  let erreursCellules = 0;
  for (let r = tableau.ligneEntete + 1; r < feuille.lignes.length; r++) {
    const ligne = feuille.lignes[r] || [];
    let vide = true, premierTexte = null;
    for (let c = tableau.bloc.debut; c <= tableau.bloc.fin; c++) {
      if (feuille.erreurs.has(r + ',' + c)) erreursCellules++;
      if (!estVide(ligne[c])) { vide = false; if (premierTexte === null && typeof ligne[c] === 'string') premierTexte = ligne[c]; }
    }
    if (vide) continue;
    if (premierTexte !== null && /^(sous )?(total|totaux)\b/.test(normaliser(premierTexte))) continue;
    const enreg = Object.create(null);
    enreg.ligne = r + 1;
    for (const col of spec.colonnes) {
      const c = tableau.colonnes.get(col.cle);
      if (c === undefined) { enreg[col.cle] = null; continue; }
      if (feuille.formulesVides.has(r + ',' + c) && (col.obligatoire || col.type === 'date')) {
        return { ok: false, message: 'Ouvrez le fichier dans Excel et enregistrez-le pour calculer les formules (onglet « ' + feuille.nom + ' », colonne « ' + col.nom + ' », ligne ' + (r + 1) + ').' };
      }
      enreg[col.cle] = convertir(ligne[c], col.type);
    }
    enregistrements.push(enreg);
  }
  if (erreursCellules > 0) alertes.push(erreursCellules + ' cellule' + (erreursCellules > 1 ? 's' : '') + ' en erreur (#N/A, #DIV/0!…) dans l\'onglet « ' + feuille.nom + ' » : traitée' + (erreursCellules > 1 ? 's' : '') + ' comme vide' + (erreursCellules > 1 ? 's' : '') + '.');
  if (tableau.interdites && tableau.interdites.length) alertes.push('Colonne' + (tableau.interdites.length > 1 ? 's' : '') + ' ignorée' + (tableau.interdites.length > 1 ? 's' : '') + ' (nom interdit) dans l\'onglet « ' + feuille.nom + ' » : ' + tableau.interdites.map(function (n) { return '« ' + n + ' »'; }).join(', ') + '.');
  return { ok: true, enregistrements: enregistrements };
}

/** Lit des paramètres « libellé → valeur à droite » dans un onglet. */
function lireValeursParLibelle(classeur, specValeurs, alertes, avecDefauts) {
  const prefere = specValeurs.onglets.map(normaliser);
  const feuille = classeur.feuilles.find(function (f) { return prefere.indexOf(normaliser(f.nom)) >= 0; });
  const resultat = Object.create(null);
  const manquants = [];
  for (const spec of specValeurs.valeurs) {
    const libelles = [spec.libelle].concat(spec.synonymes).map(normaliser);
    let valeur = null, formuleVide = false;
    if (feuille) {
      outer:
      for (let r = 0; r < Math.min(feuille.lignes.length, 400); r++) {
        const ligne = feuille.lignes[r] || [];
        for (let c = 0; c < Math.min(ligne.length, 30); c++) {
          if (typeof ligne[c] !== 'string' || libelles.indexOf(normaliser(ligne[c])) < 0) continue;
          for (let d = c + 1; d < Math.min(ligne.length, c + 6); d++) {
            if (feuille.formulesVides.has(r + ',' + d)) { formuleVide = true; break outer; }
            if (!estVide(ligne[d])) { valeur = convertir(ligne[d], spec.type); break outer; }
          }
        }
      }
    }
    if (formuleVide) return { ok: false, message: 'Ouvrez le fichier dans Excel et enregistrez-le pour calculer les formules (onglet « ' + feuille.nom + ' », « ' + spec.libelle + ' »).' };
    const valide = spec.type === 'texte' ? valeur !== null : (typeof valeur === 'number' && isFinite(valeur));
    if (valide) resultat[spec.cle] = valeur;
    else { manquants.push(spec); if (avecDefauts && spec.defaut !== undefined) resultat[spec.cle] = spec.defaut; }
  }
  if (avecDefauts && manquants.length) {
    if (!feuille) alertes.push('Onglet « ' + specValeurs.onglets[0] + ' » introuvable : seuils par défaut utilisés (DSO cible 60 j, rouge 90 j, impact 5 / 8…).');
    else for (const s of manquants) alertes.push('Paramètre « ' + s.libelle + ' » introuvable dans l\'onglet « ' + feuille.nom + ' » : valeur par défaut utilisée (' + (s.type === 'taux' ? Math.round(s.defaut * 100) + ' %' : s.defaut) + ').');
  }
  return { ok: true, valeurs: resultat, feuille: feuille };
}

/**
 * Construit et valide le modèle de données complet.
 * La nouvelle version ne remplace l'ancienne que si cette fonction réussit entièrement.
 */
function construireModele(classeur) {
  const alertes = [];
  const specF = FORMAT_ATTENDU.tableaux.factures;
  const specC = FORMAT_ATTENDU.tableaux.clients;

  const tf = trouverTableau(classeur, specF, null);
  if (!tf.ok) return tf;
  const tc = trouverTableau(classeur, specC, { feuille: tf.feuille, ligne: tf.ligneEntete, bloc: tf.bloc });
  if (!tc.ok && tc.partiel) return tc;

  const ef = extraireEnregistrements(tf, specF, alertes);
  if (!ef.ok) return ef;
  if (ef.enregistrements.length > CONFIG.lignesMax) return { ok: false, message: 'Le tableau des factures dépasse 50 000 lignes : le fichier a été refusé.' };

  // Référentiel clients
  const referentiel = new Map();
  const clients = [];
  if (tc.ok) {
    const ec = extraireEnregistrements(tc, specC, alertes);
    if (!ec.ok) return ec;
    for (const c of ec.enregistrements) {
      if (!c.client) continue;
      const cle = normaliser(c.client);
      if (referentiel.has(cle)) { alertes.push('Client « ' + c.client + ' » présent deux fois dans le référentiel (ligne ' + c.ligne + ') : la première ligne est retenue.'); continue; }
      let conditions = c.conditions;
      if (typeof conditions !== 'number' || !isFinite(conditions) || conditions < 0) { alertes.push('Conditions de paiement invalides pour « ' + c.client + ' » (onglet « ' + tc.feuille.nom + ' », ligne ' + c.ligne + ') : 0 jour retenu.'); conditions = 0; }
      const fiche = { nom: c.client, bu: c.bu || 'Business Unit non renseignée', ville: c.ville || '', code: c.code || '', conditions: Math.round(conditions) };
      referentiel.set(cle, fiche);
      clients.push(fiche);
    }
  } else if (tf.colonnes.get('bu') === undefined) {
    return { ok: false, onglet: tf.feuille.nom, colonne: 'BU', message: 'La colonne « BU » est introuvable dans l\'onglet « ' + tf.feuille.nom + ' », et aucun référentiel clients n\'a été trouvé.' };
  } else {
    alertes.push('Référentiel clients introuvable : la BU et les conditions sont lues dans le tableau des factures.');
  }

  // Paramètres et période
  const lp = lireValeursParLibelle(classeur, FORMAT_ATTENDU.parametres, alertes, true);
  if (!lp.ok) return lp;
  const lper = lireValeursParLibelle(classeur, FORMAT_ATTENDU.periode, [], false);
  if (!lper.ok) return lper;

  // Factures
  const factures = [];
  const rejets = [];
  const numerosVus = new Map();
  const inconnus = new Set();
  let anomalies = 0;
  for (const f of ef.enregistrements) {
    const raison = !f.client ? 'client vide'
      : !f.numero ? 'n° de facture vide'
      : (typeof f.date !== 'number' || !isFinite(f.date)) ? 'date de facture invalide'
      : (typeof f.montant !== 'number' || !isFinite(f.montant)) ? 'montant TTC invalide'
      : (f.encaisse !== null && (typeof f.encaisse !== 'number' || !isFinite(f.encaisse))) ? 'montant encaissé invalide'
      : null;
    if (raison) { rejets.push('ligne ' + f.ligne + ' (' + raison + ')'); continue; }
    const cle = normaliser(f.client);
    let fiche = referentiel.get(cle);
    if (!fiche) {
      const conditionsFacture = (typeof f.conditions === 'number' && isFinite(f.conditions)) ? Math.round(f.conditions) : null;
      fiche = { nom: f.client, bu: f.bu || 'Client inconnu', ville: '', code: '', conditions: conditionsFacture === null ? 0 : conditionsFacture };
      referentiel.set(cle, fiche);
      clients.push(fiche);
      if (tc.ok) inconnus.add(f.client);
    }
    let echeance;
    if (tc.ok || (typeof f.conditions === 'number' && isFinite(f.conditions))) echeance = f.date + fiche.conditions * JOUR_MS;
    else echeance = (typeof f.echeance === 'number' && isFinite(f.echeance)) ? f.echeance : f.date;
    const encaisse = f.encaisse === null ? 0 : f.encaisse;
    if (encaisse > f.montant || encaisse < 0) anomalies++;
    const numero = String(f.numero);
    const occurrence = (numerosVus.get(numero) || 0) + 1;
    numerosVus.set(numero, occurrence);
    factures.push({
      ligne: f.ligne, numero: numero, occurrence: occurrence, client: fiche.nom, bu: fiche.bu,
      date: f.date, montant: f.montant, encaisse: encaisse, statut: f.statut || '',
      conditions: fiche.conditions, echeance: echeance
    });
  }
  if (!factures.length) return { ok: false, onglet: tf.feuille.nom, message: 'Aucune facture valide dans l\'onglet « ' + tf.feuille.nom + ' » : vérifiez les colonnes Client, N° de facture, Date de facture et Montant TTC.' };
  if (rejets.length) alertes.push(rejets.length + ' ligne' + (rejets.length > 1 ? 's' : '') + ' ignorée' + (rejets.length > 1 ? 's' : '') + ' dans l\'onglet « ' + tf.feuille.nom + ' » : ' + rejets.slice(0, 6).join(', ') + (rejets.length > 6 ? '…' : '') + '.');
  const doublons = Array.from(numerosVus).filter(function (x) { return x[1] > 1; }).map(function (x) { return x[0]; });
  if (doublons.length) alertes.push('N° de facture en double : ' + doublons.slice(0, 5).join(', ') + (doublons.length > 5 ? '…' : '') + '.');
  if (inconnus.size) alertes.push('Client' + (inconnus.size > 1 ? 's' : '') + ' absent' + (inconnus.size > 1 ? 's' : '') + ' du référentiel : ' + Array.from(inconnus).slice(0, 5).map(function (n) { return '« ' + n + ' »'; }).join(', ') + '.');
  if (anomalies) alertes.push(anomalies + ' facture' + (anomalies > 1 ? 's' : '') + ' avec un encaissement supérieur au montant ou négatif.');

  // Période d'analyse (onglet « Accueil ») ; hypothèses si absente
  const per = lper.valeurs;
  let dateCloture = per.dateCloture;
  if (typeof dateCloture !== 'number') {
    const derniere = factures.reduce(function (m, f) { return Math.max(m, f.date); }, 0);
    const d = new Date(derniere);
    dateCloture = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0);
    alertes.push('Date de clôture introuvable dans l\'onglet « Accueil » : fin du mois de la dernière facture retenue.');
  }
  let debutPeriode = per.debutPeriode;
  if (typeof debutPeriode !== 'number') {
    const d = new Date(dateCloture);
    debutPeriode = Date.UTC(d.getUTCFullYear() - 1, d.getUTCMonth(), d.getUTCDate() + 1);
  }
  let nbJours = per.nbJours;
  if (typeof nbJours !== 'number' || nbJours <= 0) nbJours = Math.round((dateCloture - debutPeriode) / JOUR_MS) + 1;

  const p = lp.valeurs;
  const param = {
    dsoCible: p.dsoCible, dsoRouge: p.dsoRouge, trVert: p.trVert, trRouge: p.trRouge,
    addVert: p.addVert, addRouge: p.addRouge, p90Vert: p.p90Vert, p90Rouge: p.p90Rouge,
    impOrange: p.impOrange, impRouge: p.impRouge,
    dateCloture: dateCloture, debutPeriode: debutPeriode, nbJours: nbJours,
    entreprise: per.entreprise || 'Votre entreprise', siege: per.siege || ''
  };
  return { ok: true, modele: { param: param, clients: clients, factures: factures, alertes: alertes } };
}

/** Lit un fichier (octets) et renvoie le modèle ou une erreur claire. */
function lireEtValider(tampon, nom) {
  const controle = controlerFichier(tampon, nom);
  if (!controle.ok) return { ok: false, message: controle.message };
  let classeur;
  try { classeur = controle.type === 'csv' ? lireCSV(tampon) : lireClasseurExcel(tampon); }
  catch (e) { return { ok: false, message: (e && e.messageUtilisateur) || 'Le fichier est illisible ou abîmé : ce n\'est peut-être pas un vrai classeur Excel.' }; }
  try { return construireModele(classeur); }
  catch (e) { return { ok: false, message: 'La structure du fichier n\'a pas pu être validée : vérifiez qu\'il respecte le format attendu.' }; }
}

/* =====================================================================
   4. CALCULS (chaque calcul est une fonction séparée et simple à vérifier)
   ===================================================================== */

/** Bornes de la période choisie (Mois, Trimestre, Année). */
function bornesPeriode(p, choix) {
  const fin = p.dateCloture;
  const d = new Date(fin);
  if (choix === 'mois') {
    const debut = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
    return { debut: debut, fin: fin, jours: Math.round((fin - debut) / JOUR_MS) + 1, libelle: 'mois de clôture' };
  }
  if (choix === 'trimestre') {
    const debut = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() - 2, 1);
    return { debut: debut, fin: fin, jours: Math.round((fin - debut) / JOUR_MS) + 1, libelle: '3 derniers mois' };
  }
  return { debut: p.debutPeriode, fin: fin, jours: p.nbJours, libelle: '12 mois glissants' };
}

/** Solde, état à la clôture, jours de retard et tranche d'âge d'une facture (mêmes règles que le classeur). */
function enrichirFacture(f, p) {
  const solde = f.montant - f.encaisse;
  const etat = solde <= 0 ? 'Soldée' : (f.echeance < p.dateCloture ? 'Échue' : 'Non échue');
  const retard = etat === 'Échue' ? Math.round((p.dateCloture - f.echeance) / JOUR_MS) : 0;
  const tranche = solde <= 0 ? 'Soldée' : retard === 0 ? 'Non échue' : retard <= 30 ? '1-30 j' : retard <= 60 ? '31-60 j' : retard <= 90 ? '61-90 j' : 'Plus de 90 j';
  return Object.assign({}, f, { solde: solde, etat: etat, retard: retard, tranche: tranche });
}

function somme(liste, fn) { let s = 0; for (const x of liste) s += fn(x); return s; }

/** Chiffre d'affaires TTC de la période. */
function calculerCA(factures, bornes) { return somme(factures, function (f) { return (f.date >= bornes.debut && f.date <= bornes.fin) ? f.montant : 0; }); }
/** Encaissements des factures émises sur la période. */
function calculerEncaissePeriode(factures, bornes) { return somme(factures, function (f) { return (f.date >= bornes.debut && f.date <= bornes.fin) ? f.encaisse : 0; }); }
/** Encours clients : somme des soldes restant dus. */
function calculerEncours(factures) { return somme(factures, function (f) { return f.solde; }); }
/** Encours échu / non échu. */
function calculerEncoursParEtat(factures, etat) { return somme(factures, function (f) { return f.etat === etat ? f.solde : 0; }); }
/** Balance âgée : encours par tranche. */
function calculerTranches(factures) {
  const t = {}; for (const n of TRANCHES) t[n] = 0;
  for (const f of factures) if (t[f.tranche] !== undefined) t[f.tranche] += f.solde;
  return t;
}
/** DSO = encours ÷ CA × jours (null si non calculable). */
function calculerDSO(encours, ca, jours) { if (ca > 0) return encours / ca * jours; return encours === 0 ? 0 : null; }
/** Taux de recouvrement des factures échues. */
function calculerTauxRecouvrement(factures, p) {
  let enc = 0, fac = 0;
  for (const f of factures) if (f.echeance < p.dateCloture) { enc += f.encaisse; fac += f.montant; }
  return fac > 0 ? enc / fac : null;
}
/** Indice d'impact d'un client. */
function calculerIndiceImpact(encoursClient, encoursTotal, dsoClient, p) {
  if (dsoClient === null || encoursTotal === 0) return null;
  return (encoursClient / encoursTotal) * dsoClient / p.dsoCible * 100;
}
/** Trésorerie libérable si le DSO revenait à la cible. */
function calculerTresorerieLiberable(encours, ca, jours, p) { return Math.max(0, encours - p.dsoCible / jours * ca); }

/** Agrégats communs à l'entreprise, une BU ou un client. */
function agreger(factures, p, bornes, encoursTotal) {
  const ca = calculerCA(factures, bornes);
  const encours = calculerEncours(factures);
  const echu = calculerEncoursParEtat(factures, 'Échue');
  const nonEchu = calculerEncoursParEtat(factures, 'Non échue');
  const tranches = calculerTranches(factures);
  const dso = calculerDSO(encours, ca, bornes.jours);
  const bpdso = calculerDSO(nonEchu, ca, bornes.jours);
  return {
    ca: ca, encaissePeriode: calculerEncaissePeriode(factures, bornes),
    encours: encours, echu: echu, nonEchu: nonEchu, tranches: tranches, p90: tranches['Plus de 90 j'],
    part90: encours > 0 ? tranches['Plus de 90 j'] / encours : 0,
    dso: dso, bpdso: bpdso, add: (dso !== null && bpdso !== null) ? dso - bpdso : null,
    ecart: dso !== null ? dso - p.dsoCible : null,
    taux: calculerTauxRecouvrement(factures, p),
    part: encoursTotal > 0 ? encours / encoursTotal : 0,
    liberable: ca > 0 ? calculerTresorerieLiberable(encours, ca, bornes.jours, p) : 0
  };
}

/* Statuts (seuils lus dans le fichier) */
function statutDSO(dso, p) { if (dso === null) return 'gris'; return dso <= p.dsoCible ? 'vert' : dso <= p.dsoRouge ? 'orange' : 'rouge'; }
function statutTaux(t, p) { if (t === null) return 'gris'; return t >= p.trVert ? 'vert' : t >= p.trRouge ? 'orange' : 'rouge'; }
function statutP90(x, p) { return x <= p.p90Vert ? 'vert' : x <= p.p90Rouge ? 'orange' : 'rouge'; }
function statutImpact(i, p) { if (i === null) return 'gris'; return i < p.impOrange ? 'vert' : i < p.impRouge ? 'orange' : 'rouge'; }
function statutAlerte(part) { return part <= CONFIG.seuilsAlerte.vert ? 'vert' : part <= CONFIG.seuilsAlerte.rouge ? 'orange' : 'rouge'; }

/** Flux pour le Sankey : facturé → encaissé / non échu / échu → tranches. */
function calculerFlux(factures, bornes) {
  const liste = factures.filter(function (f) { return f.date >= bornes.debut && f.date <= bornes.fin; });
  const t = calculerTranches(liste);
  return {
    facture: somme(liste, function (f) { return f.montant; }),
    encaisse: somme(liste, function (f) { return f.encaisse; }),
    nonEchu: t['Non échue'],
    echu: t['1-30 j'] + t['31-60 j'] + t['61-90 j'] + t['Plus de 90 j'],
    tranches: t,
    nb: liste.length
  };
}

/** Initiales d'une BU pour le menu replié. */
function initiales(nom) {
  const mots = String(nom).split(/[\s&\-]+/).map(function (m) { return m.replace(/^[dl]['’]/i, ''); }).filter(function (m) { return m && ['de', 'du', 'des', 'la', 'le', 'les', 'et', 'a', 'à'].indexOf(m.toLowerCase()) < 0; });
  return (mots.slice(0, 2).map(function (m) { return m[0]; }).join('') || '?').toUpperCase();
}
function creerSlug(nom, existants) {
  let base = normaliser(nom).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'element';
  let slug = base, i = 2;
  while (existants.has(slug)) slug = base + '-' + (i++);
  existants.add(slug);
  return slug;
}

/** Calcule l'ensemble des résultats pour la période choisie. */
function calculerTout(modele, choixPeriode) {
  const p = modele.param;
  const bornes = bornesPeriode(p, choixPeriode);
  const F = modele.factures.map(function (f) { return enrichirFacture(f, p); });
  const encoursTotal = calculerEncours(F);
  const global = agreger(F, p, bornes, encoursTotal);
  global.immobilise = global.ca > 0 ? Math.max(0, global.encours - p.dsoCible / bornes.jours * global.ca) : null;
  global.flux = calculerFlux(F, bornes);

  // Clients
  const slugsClients = new Set();
  const clients = modele.clients.map(function (c) {
    const fc = F.filter(function (f) { return normaliser(f.client) === normaliser(c.nom); });
    const a = agreger(fc, p, bornes, encoursTotal);
    a.impact = calculerIndiceImpact(a.encours, encoursTotal, a.dso, p);
    return Object.assign(a, {
      nom: c.nom, bu: c.bu, ville: c.ville, code: c.code, conditions: c.conditions,
      slug: creerSlug(c.nom, slugsClients), factures: fc,
      statutDSO: statutDSO(a.dso, p), statutImpact: statutImpact(a.impact, p)
    });
  });
  const parImpact = clients.slice().sort(function (a, b) { return (b.impact === null ? -1 : b.impact) - (a.impact === null ? -1 : a.impact) || a.nom.localeCompare(b.nom, 'fr'); });
  parImpact.forEach(function (c, i) { c.rang = i + 1; });

  // Business Units, du DSO le plus élevé au plus faible
  const nomsBU = [];
  for (const c of clients) if (nomsBU.indexOf(c.bu) < 0) nomsBU.push(c.bu);
  const slugsBU = new Set();
  const bus = nomsBU.map(function (nom) {
    const fb = F.filter(function (f) { return f.bu === nom; });
    const a = agreger(fb, p, bornes, encoursTotal);
    return Object.assign(a, {
      nom: nom, slug: creerSlug(nom, slugsBU), initiales: initiales(nom),
      clients: parImpact.filter(function (c) { return c.bu === nom; }),
      statut: statutDSO(a.dso, p)
    });
  }).sort(function (a, b) { return (b.dso === null ? -1 : b.dso) - (a.dso === null ? -1 : a.dso) || a.nom.localeCompare(b.nom, 'fr'); });

  // Encours en alerte : clients au statut d'impact rouge
  const enAlerte = clients.filter(function (c) { return c.statutImpact === 'rouge'; });
  global.alerte = { montant: somme(enAlerte, function (c) { return c.encours; }), nb: enAlerte.length };
  global.alerte.part = encoursTotal > 0 ? global.alerte.montant / encoursTotal : 0;

  const statuts = {
    taux: statutTaux(global.taux, p), dso: statutDSO(global.dso, p),
    p90: statutP90(global.part90, p), alerte: statutAlerte(global.alerte.part)
  };
  const resultat = { p: p, bornes: bornes, global: global, clients: clients, parImpact: parImpact, bus: bus, statuts: statuts, factures: F };
  resultat.points = pointsAttention(resultat);
  return resultat;
}

/* =====================================================================
   Mise en forme des nombres à la française
   ===================================================================== */
const NF0 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
const NF1 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const NF2 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const ESP = ' ';
function fMAD(n) { return n === null || n === undefined ? 'n/d' : NF0.format(Math.round(n)) + ESP + 'MAD'; }
function partiesCompactes(n) {
  if (n === null || n === undefined) return { nombre: 'n/d', unite: '' };
  const a = Math.abs(n);
  if (a >= 1e6) return { nombre: NF2.format(n / 1e6), unite: 'M MAD' };
  if (a >= 1e3) return { nombre: NF0.format(n / 1e3), unite: 'k MAD' };
  return { nombre: NF0.format(n), unite: 'MAD' };
}
function fCompact(n) { const x = partiesCompactes(n); return x.unite ? x.nombre + ESP + x.unite.replace(' ', ESP) : x.nombre; }
function fAxe(n) { const a = Math.abs(n); if (a >= 1e6) return NF1.format(n / 1e6) + ' M'; if (a >= 1e3) return NF0.format(n / 1e3) + ' k'; return NF0.format(n); }
function fJours(n) { return n === null || n === undefined ? 'n/d' : NF0.format(Math.round(n)) + ESP + 'j'; }
function fEcart(n) { if (n === null || n === undefined) return 'n/d'; const r = Math.round(n); return (r > 0 ? '+' : r < 0 ? '−' : '') + NF0.format(Math.abs(r)) + ESP + 'j'; }
function fPct(x, dec) { if (x === null || x === undefined) return 'n/d'; return (dec === 0 ? NF0 : NF1).format(x * 100) + ESP + '%'; }
function fDec1(n) { return n === null || n === undefined ? 'n/d' : NF1.format(n); }
function fDate(ms) { if (typeof ms !== 'number') return ''; const d = new Date(ms); return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + d.getUTCFullYear(); }
function fHeure(date) { return date.getHours() + ' h ' + String(date.getMinutes()).padStart(2, '0'); }
function fDepuis(date) {
  if (!date) return '';
  const s = Math.max(0, Math.round((Date.now() - date.getTime()) / 1000));
  if (s < 60) return 'il y a ' + s + ' s';
  const m = Math.round(s / 60);
  if (m < 60) return 'il y a ' + m + ' min';
  return 'à ' + fHeure(date);
}
function pluriel(n, mot, motPluriel) { return n + ' ' + (n > 1 ? (motPluriel || mot + 's') : mot); }

/** Valeur découpée en nombre + unité pour les cartes KPI. */
function partiesKPI(type, n) {
  if (n === null || n === undefined) return { nombre: 'n/d', unite: '' };
  if (type === 'compact') return partiesCompactes(n);
  if (type === 'jours') return { nombre: NF0.format(Math.round(n)), unite: 'j' };
  if (type === 'pct') return { nombre: NF1.format(n * 100), unite: '%' };
  if (type === 'dec1') return { nombre: NF1.format(n), unite: '' };
  if (type === 'mad') return { nombre: NF0.format(Math.round(n)), unite: 'MAD' };
  return { nombre: NF0.format(n), unite: '' };
}

/** Trois points d'attention rédigés à partir des chiffres (règles simples, aucune IA, aucun appel réseau). */
function pointsAttention(r) {
  const p = r.p, g = r.global;
  const points = [];
  // Règle 1 : niveau du DSO global
  if (g.dso === null) {
    points.push({ statut: 'gris', titre: 'DSO global', texte: 'Aucune facture n\'a été émise sur la période choisie : le DSO n\'est pas calculable. Choisissez une période plus longue.' });
  } else if (g.dso > p.dsoCible) {
    points.push({ statut: statutDSO(g.dso, p), titre: 'DSO global', texte: 'Le DSO global atteint ' + fJours(g.dso) + ' pour une cible de ' + fJours(p.dsoCible) + ' : ' + fCompact(g.immobilise) + ' de trésorerie sont immobilisés au-delà de la cible. ' + (g.add !== null ? fJours(g.add) + ' sur ' + fJours(g.dso) + ' viennent des retards de paiement.' : '') });
  } else {
    points.push({ statut: 'vert', titre: 'DSO global', texte: 'Le DSO global (' + fJours(g.dso) + ') respecte la cible de ' + fJours(p.dsoCible) + ' : marge de ' + fJours(p.dsoCible - g.dso) + '.' });
  }
  // Règle 2 : la Business Unit la plus en retard
  const calculables = r.bus.filter(function (b) { return b.dso !== null; });
  if (calculables.length) {
    const pire = calculables[0], meilleure = calculables[calculables.length - 1];
    const texte = pire.dso > p.dsoCible
      ? '« ' + pire.nom + ' » est la BU la plus en retard avec un DSO de ' + fJours(pire.dso) + ' (' + fEcart(pire.ecart) + ' par rapport à la cible) et ' + fPct(pire.part, 0) + ' de l\'encours' + (calculables.length > 1 ? ' ; la plus performante est « ' + meilleure.nom + ' » (' + fJours(meilleure.dso) + ').' : '.')
      : 'Toutes les BU respectent la cible de ' + fJours(p.dsoCible) + ' ; la plus élevée est « ' + pire.nom + ' » (' + fJours(pire.dso) + ').';
    points.push({ statut: pire.statut, titre: 'Business Units', texte: texte });
  }
  // Règle 3 : concentration du risque sur les 3 clients à plus fort impact
  const top = r.parImpact.filter(function (c) { return c.impact !== null && c.encours > 0; }).slice(0, 3);
  if (top.length) {
    const part = g.encours > 0 ? somme(top, function (c) { return c.encours; }) / g.encours : 0;
    const liberable = somme(top, function (c) { return c.liberable; });
    const pire = top.some(function (c) { return c.statutImpact === 'rouge'; }) ? 'rouge' : top.some(function (c) { return c.statutImpact === 'orange'; }) ? 'orange' : 'vert';
    points.push({ statut: pire, titre: 'Concentration', texte: 'Les ' + top.length + ' clients à plus fort impact (' + top.map(function (c) { return c.nom; }).join(', ') + ') portent ' + fPct(part, 0) + ' de l\'encours' + (liberable > 0 ? ' : ramener leur DSO à ' + fJours(p.dsoCible) + ' libérerait ' + fCompact(liberable) + ' de trésorerie.' : '.') });
  }
  if (points.length < 3) {
    points.push({ statut: statutP90(g.part90, p), titre: 'Créances > 90 j', texte: 'Les créances de plus de 90 jours représentent ' + fPct(g.part90) + ' de l\'encours, soit ' + fMAD(g.p90) + '.' });
  }
  return points.slice(0, 3);
}

/** Compare deux versions du fichier pour le résumé du changement. */
function comparerModeles(ancien, nouveau) {
  const cle = function (f) { return f.numero + '#' + f.occurrence; };
  const sig = function (f) { return JSON.stringify([f.client, f.bu, f.date, f.montant, f.encaisse, f.statut, f.conditions, f.echeance]); };
  const avant = new Map(ancien.factures.map(function (f) { return [cle(f), sig(f)]; }));
  const apres = new Map(nouveau.factures.map(function (f) { return [cle(f), sig(f)]; }));
  let modifiees = 0, ajoutees = 0, supprimees = 0;
  for (const [k, s] of apres) { if (!avant.has(k)) ajoutees++; else if (avant.get(k) !== s) modifiees++; }
  for (const k of avant.keys()) if (!apres.has(k)) supprimees++;
  return {
    modifiees: modifiees, ajoutees: ajoutees, supprimees: supprimees,
    parametres: JSON.stringify(ancien.param) !== JSON.stringify(nouveau.param),
    clients: JSON.stringify(ancien.clients) !== JSON.stringify(nouveau.clients)
  };
}
function resumerDifferences(d) {
  const morceaux = [];
  const elements = [[d.modifiees, 'modifiée'], [d.ajoutees, 'ajoutée'], [d.supprimees, 'supprimée']].filter(function (x) { return x[0] > 0; });
  elements.forEach(function (x, i) {
    const accord = x[1] + (x[0] > 1 ? 's' : '');
    morceaux.push(i === 0 ? x[0] + ' ligne' + (x[0] > 1 ? 's' : '') + ' ' + accord : x[0] + ' ' + accord);
  });
  if (d.parametres) morceaux.push('paramètres modifiés');
  if (d.clients && !elements.length) morceaux.push('référentiel clients modifié');
  return morceaux.length ? morceaux.join(', ') : 'ordre ou présentation des lignes modifiés';
}

/* =====================================================================
   5. SYNCHRONISATION EXCEL ↔ APPLICATION (3 modes choisis automatiquement)
   ===================================================================== */
const sync = {
  active: lirePreference('synchro', '1') === '1',
  mode: null,                 // 'direct' | 'enligne' | 'import' | null
  poignee: null,              // FileSystemFileHandle (jamais le contenu)
  nomFichier: '',
  etat: 'aucun',              // ok | pause | lecture | reconnexion | erreur | import | aucun
  raison: '',
  derniereMaj: null,
  signature: null,            // { t: lastModified, s: taille } en mode direct
  empreinteOctets: null,
  versionEnErreur: false,
  raisonErreur: '',
  attenteReconnexion: false,
  poigneeInvalide: false,
  minuteur: null,
  enCours: false,
  aRelancer: false,
  dernierTic: 0,
  echecsLecture: 0,
  fsa: typeof window.showOpenFilePicker === 'function'
};

const etat = {
  modele: null, empreinte: null, resultats: null,
  chargement: true, erreurInitiale: null,
  periode: 'annee',
  ui: { tables: new Map(), deplies: new Set(), premierRendu: true },
  graphiques: new Map(),
  feuille: null
};

function estHttp() { return location.protocol === 'http:' || location.protocol === 'https:'; }
function estLocal() { return /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname); }
function attendre(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function intervalleCourant() {
  if (sync.mode === 'direct') return CONFIG.intervalleDirectMs;
  if (sync.mode === 'enligne') return estLocal() ? CONFIG.intervalleLocalMs : CONFIG.intervalleEnLigneMs;
  return null;
}
function etatNominal() {
  if (sync.attenteReconnexion || sync.poigneeInvalide) return 'reconnexion';
  if (sync.versionEnErreur) return 'erreur';
  if (!sync.mode) return 'aucun';
  if (sync.mode === 'import') return 'import';
  if (!sync.active) return 'pause';
  return 'ok';
}
function definirEtat(nouvelEtat, raison) {
  if (nouvelEtat === 'reconnexion' && raison) sync.raisonReconnexion = raison;
  sync.etat = nouvelEtat;
  sync.raison = raison || (nouvelEtat === 'erreur' ? sync.raisonErreur : nouvelEtat === 'reconnexion' ? (sync.raisonReconnexion || '') : '');
  majPanneaux();
  majBandeaux();
}

/** Programme la prochaine vérification (une seule à la fois, jamais en parallèle). */
function planifier(delai) {
  clearTimeout(sync.minuteur);
  sync.minuteur = null;
  const iv = intervalleCourant();
  if (!sync.active || iv === null || sync.attenteReconnexion || sync.poigneeInvalide) return;
  sync.minuteur = setTimeout(tic, delai === undefined ? iv : delai);
}
async function tic() {
  const maintenant = Date.now();
  const iv = intervalleCourant() || 0;
  const reveil = sync.dernierTic > 0 && (maintenant - sync.dernierTic) > iv * 3 + 10000;
  sync.dernierTic = maintenant;
  await verifier({ reveil: reveil });
  planifier();
}

/** Vérifie le fichier selon le mode actif. */
async function verifier(options) {
  const opts = options || {};
  if (!sync.active && !opts.force) return;
  if (sync.enCours) { sync.aRelancer = true; return; }
  sync.enCours = true;
  try {
    if (sync.mode === 'direct' && sync.poignee) await verifierDirect(opts);
    else if (sync.mode === 'enligne') await verifierEnLigne(opts);
  } catch (e) {
    definirEtat('erreur', 'Une erreur inattendue est survenue pendant la lecture : les dernières données sont conservées.');
  } finally {
    sync.enCours = false;
    if (sync.aRelancer) { sync.aRelancer = false; setTimeout(function () { verifier({}); }, 60); }
  }
}

function gererErreurAcces(e) {
  const nom = e && e.name;
  if (nom === 'NotFoundError' || nom === 'TypeMismatchError') {
    sync.poigneeInvalide = true;
    definirEtat('reconnexion', 'Le fichier a été déplacé, renommé ou supprimé : les données sont conservées. Reconnectez-le.');
  } else if (nom === 'NotAllowedError' || nom === 'SecurityError') {
    sync.attenteReconnexion = true;
    definirEtat('reconnexion', 'L\'autorisation de lecture a expiré : un clic sur « Reconnecter » suffit.');
  } else if (nom === 'NotReadableError') {
    sync.echecsLecture++;
    if (sync.echecsLecture >= 4) definirEtat('reconnexion', 'Le fichier est momentanément inaccessible (ordinateur sorti de veille ?). Cliquez sur « Reconnecter ».');
    return;
  } else {
    definirEtat('reconnexion', 'Le fichier est momentanément inaccessible : cliquez sur « Reconnecter ».');
  }
  planifier();
}

/** Lecture avec 3 nouveaux essais en 1 seconde si le fichier est en cours d'enregistrement. */
async function lireOctetsAvecEssais() {
  let derniere = null;
  for (let essai = 0; essai <= CONFIG.essaisLecture; essai++) {
    try {
      const fichier = await sync.poignee.getFile();
      if (fichier.size > CONFIG.tailleMax) return { fichier: fichier, tampon: null };
      const tampon = await fichier.arrayBuffer();
      return { fichier: fichier, tampon: tampon };
    } catch (e) {
      derniere = e;
      if (e && (e.name === 'NotFoundError' || e.name === 'NotAllowedError' || e.name === 'SecurityError')) throw e;
      if (essai < CONFIG.essaisLecture) await attendre(CONFIG.delaiEssaiMs);
    }
  }
  throw derniere || new Error('lecture');
}

/** Mode A · Direct : nouvel appel getFile(), comparaison de la date et de la taille. */
async function verifierDirect(opts) {
  let f1;
  try { f1 = await sync.poignee.getFile(); }
  catch (e) { gererErreurAcces(e); return; }
  sync.echecsLecture = 0;
  if (sync.etat === 'reconnexion' && !sync.attenteReconnexion && !sync.poigneeInvalide) definirEtat(etatNominal());
  if (!opts.force && sync.signature && f1.lastModified === sync.signature.t && f1.size === sync.signature.s) {
    if (sync.etat !== etatNominal()) definirEtat(etatNominal());
    return;
  }
  definirEtat('lecture');
  // Attendre que l'enregistrement d'Excel soit terminé : date et taille stables.
  let reference = f1, stable = false;
  for (let i = 0; i < 6; i++) {
    await attendre(CONFIG.attenteStabiliteMs);
    let f2;
    try { f2 = await sync.poignee.getFile(); } catch (e) { if (e && e.name === 'NotReadableError') continue; gererErreurAcces(e); return; }
    if (f2.lastModified === reference.lastModified && f2.size === reference.size) { stable = true; reference = f2; break; }
    reference = f2;
  }
  if (!stable) { definirEtat(etatNominal()); sync.aRelancer = true; return; }
  let lu;
  try { lu = await lireOctetsAvecEssais(); }
  catch (e) {
    if (e && (e.name === 'NotFoundError' || e.name === 'NotAllowedError' || e.name === 'SecurityError')) { gererErreurAcces(e); return; }
    sync.signature = null;
    echecLecture('Le fichier n\'a pas pu être lu après 3 essais (incomplet ou verrouillé pendant l\'enregistrement).');
    return;
  }
  if (lu.fichier.lastModified !== reference.lastModified || lu.fichier.size !== reference.size) { definirEtat(etatNominal()); sync.aRelancer = true; return; }
  sync.nomFichier = lu.fichier.name || sync.nomFichier;
  if (!lu.tampon) { sync.signature = { t: lu.fichier.lastModified, s: lu.fichier.size }; echecLecture('Le fichier pèse ' + formaterMo(lu.fichier.size) + ' : la taille maximale acceptée est de 10 Mo.'); return; }
  await traiterOctets(lu.tampon, sync.nomFichier, 'direct');
  sync.signature = { t: lu.fichier.lastModified, s: lu.fichier.size };
}

/** Mode B · En ligne : relecture de donnees.xlsx placé à côté d'index.html. */
async function verifierEnLigne(opts) {
  let reponse;
  try { reponse = await fetch(CONFIG.fichierParDefaut, { cache: 'no-cache', credentials: 'same-origin', redirect: 'error' }); }
  catch (e) { if (opts.premier) return false; definirEtat('reconnexion', 'Le fichier en ligne est inaccessible pour le moment : nouvel essai automatique.'); return false; }
  if (!reponse.ok) { if (opts.premier) return false; definirEtat('reconnexion', 'Le fichier « ' + CONFIG.fichierParDefaut + ' » est introuvable en ligne (erreur ' + reponse.status + ').'); return false; }
  const annonce = Number(reponse.headers.get('content-length') || 0);
  if (annonce > CONFIG.tailleMax) { echecLecture('Le fichier en ligne pèse ' + formaterMo(annonce) + ' : la taille maximale acceptée est de 10 Mo.'); return false; }
  const tampon = await reponse.arrayBuffer();
  sync.nomFichier = CONFIG.fichierParDefaut;
  const emp = await empreinte(tampon);
  if (emp === sync.empreinteOctets && !sync.versionEnErreur) {
    if (sync.etat !== etatNominal()) definirEtat(etatNominal());
    return true;
  }
  if (!opts.premier) definirEtat('lecture');
  return traiterOctets(tampon, CONFIG.fichierParDefaut, 'enligne', emp);
}

/** Lit, valide et applique un fichier. Les anciennes données restent en place en cas d'échec. */
async function traiterOctets(tampon, nom, source, empreinteConnue) {
  const emp = empreinteConnue || await empreinte(tampon);
  if (emp === sync.empreinteOctets && etat.modele && !sync.versionEnErreur) {
    sync.derniereMaj = new Date();
    definirEtat(etatNominal());
    if (source === 'import') toast('info', 'Fichier importé : aucune modification depuis la dernière lecture.');
    return true;
  }
  const res = lireEtValider(tampon, nom);
  if (!res.ok) { echecLecture(res.message); return false; }
  sync.empreinteOctets = emp;
  await appliquerModele(res.modele, nom);
  return true;
}

function echecLecture(message) {
  sync.versionEnErreur = true;
  sync.raisonErreur = message;
  if (etat.modele) {
    definirEtat('erreur', message);
    toast('erreur', 'Fichier illisible : dernières données conservées. ' + message);
  } else {
    etat.chargement = false;
    etat.erreurInitiale = message;
    definirEtat('erreur', message);
    rendrePage({ conserver: false });
  }
}

/** Remplace les données affichées, seulement si leur empreinte a changé. */
async function appliquerModele(modele, nom) {
  const nouvelle = await empreinte(JSON.stringify({ param: modele.param, clients: modele.clients, factures: modele.factures }));
  const ancien = etat.modele;
  const etaitEnErreur = sync.versionEnErreur;
  sync.versionEnErreur = false;
  sync.raisonErreur = '';
  sync.derniereMaj = new Date();
  etat.erreurInitiale = null;
  etat.chargement = false;
  if (ancien && nouvelle === etat.empreinte) {
    etat.modele.alertes = modele.alertes;
    definirEtat(etatNominal());
    if (etaitEnErreur) toast('succes', 'Fichier corrigé : la synchronisation fonctionne de nouveau.');
    return;
  }
  const differences = ancien ? comparerModeles(ancien, modele) : null;
  etat.modele = modele;
  etat.empreinte = nouvelle;
  recalculer();
  definirEtat(etatNominal());
  rendreTout({ conserver: !!ancien, synchro: !!ancien });
  if (ancien) toast('succes', 'Données mises à jour à ' + fHeure(sync.derniereMaj) + ' : ' + resumerDifferences(differences) + '.');
  else toast('succes', 'Fichier « ' + nom + ' » chargé : ' + pluriel(modele.factures.length, 'facture') + ', ' + pluriel(modele.clients.length, 'client') + '.');
  if (modele.alertes.length && (!ancien || JSON.stringify(ancien.alertes) !== JSON.stringify(modele.alertes))) {
    toast('alerte', pluriel(modele.alertes.length, 'point') + ' à vérifier dans le fichier : voir le bandeau en haut de la page.');
  }
}

function recalculer() {
  if (!etat.modele) { etat.resultats = null; return; }
  etat.resultats = calculerTout(etat.modele, etat.periode);
}

  let poignees;
  try {

      multiple: false, excludeAcceptAllOption: false,

/** « Reconnecter » : un seul clic suffit si le navigateur redemande l'autorisation. */
async function reconnecter() {
  if (!sync.fsa) { ouvrirSelecteurImport(); return; }

  let permission = 'denied';
  try { permission = await sync.poignee.requestPermission({ mode: 'read' }); }

  sync.attenteReconnexion = false;
  sync.mode = 'direct';
  sync.signature = null;
  sync.echecsLecture = 0;
  definirEtat('lecture');
  await verifier({ force: true });
  planifier();

/* --- Tableau premium : tri, recherche, puces, total, export Excel --- */
function tableauPremium(cfg) {
  const cle = cleRoute() + '|' + cfg.id;
  let st = etat.ui.tables.get(cle);
  if (!st) { st = { recherche: '', tri: Object.assign({}, cfg.triDefaut), filtre: 'tous' }; etat.ui.tables.set(cle, st); }
