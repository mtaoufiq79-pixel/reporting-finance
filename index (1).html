  const pied = el('tfoot');
  const ligneEntete = el('tr');
  const table = el('table', { class: 'premium', 'aria-labelledby': idTitre }, el('caption', { class: 'masque-visuel', texte: cfg.titre + ' (cliquez sur un en-tête pour trier)' }), el('thead', null, ligneEntete), corps, pied);
  const boutonsPuces = [];

  function valeurTri(col, ligne) { const v = col.valeur(ligne); return typeof v === 'string' ? normaliser(v) : v; }
  function lignesVisibles() {
    const q = normaliser(st.recherche);
    let lignes = cfg.lignes.filter(function (l) {
      if (cfg.puces && st.filtre !== 'tous' && cfg.statutDe(l) !== st.filtre) return false;
      if (!q) return true;
      return cfg.colonnes.some(function (c) { return c.recherche && normaliser(c.valeur(l)).indexOf(q) >= 0; });
    });
    const col = cfg.colonnes.find(function (c) { return c.cle === st.tri.cle; });
    if (col) {
      const sens = st.tri.sens === 'asc' ? 1 : -1;
      lignes = lignes.slice().sort(function (a, b) {
        const va = valeurTri(col, a), vb = valeurTri(col, b);
        if (va === null || va === undefined) return 1;
        if (vb === null || vb === undefined) return -1;
        if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * sens;
        return String(va).localeCompare(String(vb), 'fr') * sens;
      });
    }
    return lignes;
  }
  function majEntetes() {
    vider(ligneEntete);
    cfg.colonnes.forEach(function (col) {
      const actif = st.tri.cle === col.cle;
      ligneEntete.appendChild(el('th', { scope: 'col', class: col.droite ? 'droite' : null, 'aria-sort': actif ? (st.tri.sens === 'asc' ? 'ascending' : 'descending') : 'none' },
        el('button', { type: 'button', 'data-focus': 'tri-' + cfg.id + '-' + col.cle, onclick: function () {
          if (st.tri.cle === col.cle) st.tri.sens = st.tri.sens === 'asc' ? 'desc' : 'asc';
          else st.tri = { cle: col.cle, sens: col.droite ? 'desc' : 'asc' };
          majEntetes(); majCorps();
          const b = ligneEntete.querySelector('[data-focus="tri-' + cfg.id + '-' + col.cle + '"]'); if (b) b.focus();
        } }, col.titre, el('span', { class: 'fleche', 'aria-hidden': 'true', texte: actif ? (st.tri.sens === 'asc' ? '▲' : '▼') : '↕' }))));
    });
  }
  function majCorps() {
    vider(corps); vider(pied);

/** Export Excel des lignes visibles, avec neutralisation des formules piégées. */
function exporterTableau(cfg, lignes) {
  if (!window.XLSX || !window.XLSX.utils) { toast('erreur', 'L\'export n\'est pas disponible : le module Excel n\'est pas chargé.'); return; }
  try {
    const aoa = [cfg.colonnes.map(function (c) { return c.titre; })];
    lignes.forEach(function (l) { aoa.push(cfg.colonnes.map(function (c) { const v = c.exporter ? c.exporter(l) : c.valeur(l); return v === null || v === undefined ? '' : v; })); });
    if (cfg.totalExport && lignes.length) { const t = cfg.totalExport(lignes); aoa.push(cfg.colonnes.map(function (c, i) { return i === 0 ? 'Total' : (t[c.cle] === undefined || t[c.cle] === null ? '' : t[c.cle]); })); }
    const propre = aoa.map(function (ligne) { return ligne.map(neutraliserCellule); });
    const ws = window.XLSX.utils.aoa_to_sheet(propre);
    const wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, 'Export');
    const date = new Date();
    const nom = 'export-' + cfg.id + '-' + date.getFullYear() + String(date.getMonth() + 1).padStart(2, '0') + String(date.getDate()).padStart(2, '0') + '.xlsx';
    window.XLSX.writeFile(wb, nom, { compression: true });
    toast('succes', 'Export Excel terminé : ' + pluriel(lignes.length, 'ligne') + ' (' + nom + ').');
  } catch (e) {
    toast('erreur', 'L\'export Excel n\'a pas pu être créé.');
  }
}

/** Capture et illumination des KPI modifiés par une synchronisation. */
function capturerKPI() {
  const m = new Map();
  document.querySelectorAll('[data-kpi]').forEach(function (n) { m.set(n.getAttribute('data-kpi'), n.textContent); });
  return m;
}
function illuminerKPI(avant) {
  document.querySelectorAll('[data-kpi]').forEach(function (n) {
    const id = n.getAttribute('data-kpi');
    if (avant.has(id) && avant.get(id) !== n.textContent) {
      n.classList.remove('illumine');
      void n.offsetWidth;
      n.classList.add('illumine');
      setTimeout(function () { n.classList.remove('illumine'); }, CONFIG.dureeIlluminationMs);
    }
  });
}
/** Chiffres qui montent (désactivé si « réduire les animations »). */
function animerChiffres() {
  if (reduireAnimations()) return;
  document.querySelectorAll('.kpi-valeur[data-cible]').forEach(function (n) {
    const cible = parseFloat(n.dataset.cible);
    if (!isFinite(cible)) return;
    const format = n.dataset.format;
    const nb = n.querySelector('.nb');
    const final = partiesKPI(format, cible);
    const debut = performance.now(), duree = 900;
    const etape = function (t) {
      const k = Math.min(1, (t - debut) / duree);
      const v = cible * (1 - Math.pow(1 - k, 3));
      let texte;
      if (k >= 1) texte = final.nombre;
      else if (final.unite === 'M MAD') texte = NF2.format(v / 1e6);
      else if (final.unite === 'k MAD') texte = NF0.format(v / 1e3);
      else texte = partiesKPI(format, v).nombre;
      nb.textContent = texte;
      if (k < 1) requestAnimationFrame(etape);
    };
    requestAnimationFrame(etape);
  });
}

/* --- Fond animé : particules reliées, grenat et or, sur un fond liquide --- */
const fond = { ctx: null, toile: null, particules: [], taches: [], raf: 0, l: 0, h: 0, dernier: 0 };
function couleursFond() {
  const sombre = document.documentElement.getAttribute('data-theme') === 'sombre';
  return sombre
    ? { base: '#000000', taches: ['rgba(122,10,22,0.55)', 'rgba(79,0,0,0.65)', 'rgba(245,201,113,0.10)'], grenat: 'rgba(200,40,58,0.85)', or: 'rgba(245,201,113,0.9)', lien: [245, 201, 113], alphaLien: 0.22 }
    : { base: '#F6EFE3', taches: ['rgba(245,201,113,0.38)', 'rgba(79,0,0,0.10)', 'rgba(201,162,75,0.22)'], grenat: 'rgba(122,16,32,0.55)', or: 'rgba(184,138,46,0.75)', lien: [79, 0, 0], alphaLien: 0.13 };
}
function initialiserFond() {
  fond.toile = document.getElementById('fond');
  fond.ctx = fond.toile.getContext('2d');
  if (!fond.ctx) return;
  let attente = null;
  window.addEventListener('resize', function () { clearTimeout(attente); attente = setTimeout(redimensionnerFond, 200); });
  mqReduit.addEventListener('change', redemarrerFond);
  mqMobile.addEventListener('change', redemarrerFond);
  document.addEventListener('visibilitychange', redemarrerFond);
  redimensionnerFond();
}
function redimensionnerFond() {
  if (!fond.ctx) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  fond.l = window.innerWidth; fond.h = window.innerHeight;
  fond.toile.width = Math.round(fond.l * dpr); fond.toile.height = Math.round(fond.h * dpr);
  fond.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.round(Math.max(28, Math.min(90, fond.l * fond.h / 16000)));
  fond.particules = [];
  for (let i = 0; i < n; i++) fond.particules.push({ x: Math.random() * fond.l, y: Math.random() * fond.h, vx: (Math.random() - 0.5) * 0.22, vy: (Math.random() - 0.5) * 0.22, r: 1 + Math.random() * 1.8, or: i % 3 === 0 });
  const rayon = Math.max(fond.l, fond.h) * 0.5;
  fond.taches = [0, 1, 2].map(function (i) { return { x: Math.random() * fond.l, y: Math.random() * fond.h, r: rayon * (0.8 + i * 0.2), vx: (Math.random() - 0.5) * 0.12, vy: (Math.random() - 0.5) * 0.12, i: i }; });
  redemarrerFond();
}
function dessinerFond() {
  const ctx = fond.ctx, c = couleursFond();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = c.base;
  ctx.fillRect(0, 0, fond.l, fond.h);
  for (const t of fond.taches) {
    const g = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, t.r);
    g.addColorStop(0, c.taches[t.i]); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, fond.l, fond.h);
  }
  const P = fond.particules, D = 140;
  ctx.lineWidth = 0.8;
  for (let i = 0; i < P.length; i++) {
    for (let j = i + 1; j < P.length; j++) {
      const dx = P[i].x - P[j].x, dy = P[i].y - P[j].y, d2 = dx * dx + dy * dy;
      if (d2 < D * D) {
        ctx.strokeStyle = 'rgba(' + c.lien.join(',') + ',' + ((1 - Math.sqrt(d2) / D) * c.alphaLien).toFixed(3) + ')';
        ctx.beginPath(); ctx.moveTo(P[i].x, P[i].y); ctx.lineTo(P[j].x, P[j].y); ctx.stroke();
      }
    }
  }
  for (const p of P) { ctx.fillStyle = p.or ? c.or : c.grenat; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
}
function avancerFond() {
  for (const p of fond.particules) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < -10) p.x = fond.l + 10; if (p.x > fond.l + 10) p.x = -10;
    if (p.y < -10) p.y = fond.h + 10; if (p.y > fond.h + 10) p.y = -10;
  }
  for (const t of fond.taches) {
    t.x += t.vx; t.y += t.vy;
    if (t.x < 0 || t.x > fond.l) t.vx = -t.vx;
    if (t.y < 0 || t.y > fond.h) t.vy = -t.vy;
  }
}
function boucleFond(temps) {
  fond.raf = requestAnimationFrame(boucleFond);
  if (temps - fond.dernier < 33) return; // ~30 images par seconde : lent et économe
  fond.dernier = temps;
  avancerFond();
  dessinerFond();
}
function redemarrerFond() {
  if (!fond.ctx) return;
  cancelAnimationFrame(fond.raf);
  fond.raf = 0;
  dessinerFond();
  const statique = reduireAnimations() || mqMobile.matches || document.hidden;
  if (!statique) fond.raf = requestAnimationFrame(boucleFond);
}

const observateurTaille = typeof ResizeObserver === 'function' ? new ResizeObserver(function (entrees) {

function libererGraphiques() {
  for (const [zone, inst] of etat.graphiques) { if (observateurTaille) observateurTaille.unobserve(zone); try { inst.dispose(); } catch (e) { /* rien */ } }
  etat.graphiques.clear();

function monterGraphique(zone, fabrique) {
  const messageVide = function (texte) { vider(zone); zone.appendChild(el('div', { class: 'graphique-vide', texte: texte })); };
  if (!window.echarts || typeof window.echarts.init !== 'function') { messageVide('Graphique indisponible : la bibliothèque de graphiques n\'a pas pu être chargée.'); return; }
  let option;
  try { option = fabrique(); } catch (e) { messageVide('Ce graphique n\'a pas pu être calculé.'); return; }

    etat.graphiques.set(zone, inst);

  const c = couleurs();
  if (!(total > 0)) return { vide: 'Aucun encours : tout est soldé.' };
  const donnees = TRANCHES.map(function (t) { return { name: t, value: Math.max(0, tranches[t]), itemStyle: { color: couleurTranche(c, t) } }; }).filter(function (d) { return d.value > 0; });
  return Object.assign(optionBase(c), {
    legend: Object.assign(legende(c, TRANCHES), { top: 'auto', bottom: 0 }),
    tooltip: avecInfobulle(c, { trigger: 'item', formatter: function (q) { return q.name + '\n' + fMAD(q.value) + ' · ' + NF1.format(q.percent) + ' %'; } }),
    graphic: [
      { type: 'text', left: 'center', top: '36%', style: { text: fCompact(total), fill: c.principale, font: '300 22px Inter, system-ui, sans-serif', textAlign: 'center' } },
      { type: 'text', left: 'center', top: '46%', style: { text: 'encours', fill: c.texte2, font: '400 12px Inter, system-ui, sans-serif', textAlign: 'center' } }
    ],
    series: [{
      type: 'pie', radius: ['52%', '74%'], center: ['50%', '44%'], avoidLabelOverlap: true, padAngle: 2,
      itemStyle: { borderRadius: 6, borderColor: 'transparent', borderWidth: 2 },
      label: { color: c.texte, fontSize: 12, formatter: function (q) { return NF0.format(q.percent) + ' %'; } },
      labelLine: { lineStyle: { color: c.grille } },
      data: donnees
    }]
  });
}

/** Radar : la BU comparée à la moyenne de l'entreprise sur 5 critères. */
function optionRadar(r, bu) {
  const c = couleurs(), g = r.global;
  const moyennePart = r.bus.length ? 1 / r.bus.length : 0;
  const v = function (x) { return x === null || x === undefined ? 0 : x; };
  const valeursBU = [v(bu.dso), v(bu.add), v(bu.taux) * 100, bu.part90 * 100, bu.part * 100];
  const valeursEnt = [v(g.dso), v(g.add), v(g.taux) * 100, g.part90 * 100, moyennePart * 100];
  const max = function (i, plancher) { return Math.max(plancher, Math.ceil(Math.max(valeursBU[i], valeursEnt[i]) * 1.25)); };
  const noms = ['DSO (j)', 'Retard moyen (j)', 'Taux de recouvrement (%)', 'Part > 90 j (%)', 'Part de l\'encours (%)'];
  return Object.assign(optionBase(c), {
    legend: Object.assign(legende(c, [bu.nom, 'Moyenne entreprise']), { top: 'auto', bottom: 0 }),
    tooltip: avecInfobulle(c, { trigger: 'item', formatter: function (q) { return q.name + '\n' + noms.map(function (n, i) { return n + ' : ' + NF1.format(q.value[i]); }).join('\n'); } }),
    radar: {
      center: ['50%', '48%'], radius: '62%', splitNumber: 4,
      indicator: [{ name: noms[0], max: max(0, 60) }, { name: noms[1], max: max(1, 10) }, { name: noms[2], max: 100 }, { name: noms[3], max: max(3, 10) }, { name: noms[4], max: max(4, 10) }],
      axisName: { color: c.texte, fontSize: 11 },
      splitLine: { lineStyle: { color: c.grille } }, splitArea: { show: false }, axisLine: { lineStyle: { color: c.grille } }
    },
    series: [{
      type: 'radar', symbolSize: 5,
      data: [
        { name: bu.nom, value: valeursBU.map(arrondi1), itemStyle: { color: c.principale }, lineStyle: { color: c.principale, width: 2 }, areaStyle: { color: c.principale, opacity: 0.16 } },
        { name: 'Moyenne entreprise', value: valeursEnt.map(arrondi1), itemStyle: { color: c.series[1] }, lineStyle: { color: c.series[1], width: 2, type: 'dashed' }, areaStyle: { color: c.series[1], opacity: 0.10 } }
      ]
    }]
  });
}

/** Jauge : DSO du client face à la cible. */
function optionJaugeDSO(r, client) {
  const c = couleurs(), p = r.p, d = client.dso;
  if (d === null) return { vide: 'DSO non calculable : aucune facture émise sur la période choisie.' };
  const max = Math.max(Math.ceil(p.dsoRouge * 1.5 / 30) * 30, Math.ceil(d * 1.15 / 30) * 30);
  return Object.assign(optionBase(c), {
    tooltip: { show: false },
    series: [{
      type: 'gauge', min: 0, max: max, startAngle: 210, endAngle: -30, radius: '92%', center: ['50%', '56%'], splitNumber: 6,
      axisLine: { lineStyle: { width: 16, color: [[p.dsoCible / max, c.vert], [p.dsoRouge / max, c.orange], [1, c.rouge]] } },
      pointer: { width: 5, length: '62%', itemStyle: { color: c.principale } },
      anchor: { show: true, size: 12, itemStyle: { color: c.principale } },
      axisTick: { distance: -16, length: 6, lineStyle: { color: c.texte2, width: 1 } },
      splitLine: { distance: -16, length: 16, lineStyle: { color: c.texte2, width: 1.5 } },
      axisLabel: { distance: 22, color: c.texte2, fontSize: 11, formatter: function (v) { return Math.round(v) + ''; } },
      title: { offsetCenter: [0, '78%'], color: c.texte2, fontSize: 12 },
      detail: { offsetCenter: [0, '46%'], color: c.principale, fontSize: 34, fontWeight: 200, fontFamily: 'Inter, system-ui, sans-serif', formatter: function (v) { return Math.round(v) + ' j'; } },
      data: [{ value: arrondi1(d), name: 'Cible ' + p.dsoCible + ' j · écart ' + fEcart(client.ecart) }]
    }]
  });
}

/** Barres empilées : chaque facture, montant encaissé et solde restant dû. */
function optionFactures(client) {
  const c = couleurs();
  const factures = client.factures.slice().sort(function (a, b) { return a.date - b.date; });
  if (!factures.length) return { vide: 'Aucune facture pour ce client.' };
  return Object.assign(optionBase(c), {
    legend: legende(c, ['Encaissé', 'Solde restant dû']),
    grid: { left: 8, right: 8, top: 48, bottom: 8, containLabel: true },
    tooltip: avecInfobulle(c, { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: function (qs) { const f = factures[qs[0].dataIndex]; return f.numero + ' · ' + fDate(f.date) + '\nMontant : ' + fMAD(f.montant) + '\nEncaissé : ' + fMAD(f.encaisse) + '\nSolde : ' + fMAD(f.solde) + '\nTranche : ' + f.tranche; } }),
    xAxis: { type: 'category', data: factures.map(function (f) { return f.numero; }), axisLabel: { color: c.texte2, rotate: 30, fontSize: 11, interval: 0 }, axisTick: { show: false }, axisLine: { lineStyle: { color: c.grille } } },
    yAxis: { type: 'value', axisLabel: { color: c.texte2, formatter: fAxe }, splitLine: { lineStyle: { color: c.grille } } },
    series: [
      { name: 'Encaissé', type: 'bar', stack: 'f', barWidth: '48%', itemStyle: { color: c.series[1] }, data: factures.map(function (f) { return f.encaisse; }) },
      { name: 'Solde restant dû', type: 'bar', stack: 'f', itemStyle: { color: c.rouge, borderRadius: [6, 6, 0, 0] },
        data: factures.map(function (f) { return { value: Math.max(0, f.solde), itemStyle: { color: f.solde > 0 ? couleurTranche(c, f.tranche) : c.vert } }; }) }
    ]
  });
}

/* =====================================================================
   8. DÉMARRAGE ET ÉCOUTEURS
   ===================================================================== */
async function lancerChargement() {
  etat.chargement = true;
  etat.erreurInitiale = null;
  if (!window.XLSX || typeof window.XLSX.read !== 'function') {
    etat.chargement = false;
    etat.erreurInitiale = 'Le module de lecture Excel n\'a pas pu être chargé. Vérifiez votre connexion Internet, puis cliquez sur « Réessayer ».';
    definirEtat('aucun');
    rendrePage();
    return;
  }
  // 1. Reconnecter le fichier déjà connecté (mode A)
  const poignee = sync.fsa ? await idbLirePoignee() : null;
  if (poignee && poignee.kind === 'file' && typeof poignee.queryPermission === 'function') {
    sync.poignee = poignee;
    sync.nomFichier = poignee.name;
    sync.mode = 'direct';
    let permission = 'prompt';
    try { permission = await poignee.queryPermission({ mode: 'read' }); } catch (e) { permission = 'prompt'; }
    if (permission === 'granted') {
      await verifier({ force: true });
      finChargement();
      planifier();
      return;
    }
    sync.attenteReconnexion = true;
    definirEtat('reconnexion', 'Cliquez sur « Reconnecter » pour reprendre le suivi de « ' + poignee.name + ' ».');
    if (estHttp()) { sync.mode = 'enligne'; await verifierEnLigne({ premier: true }); sync.mode = 'direct'; sync.nomFichier = poignee.name; }
    finChargement();
    majPanneaux();
    return;
  }
  // 2. Charger donnees.xlsx placé à côté d'index.html (mode B)
  if (estHttp()) {
    sync.mode = 'enligne';
    const ok = await verifierEnLigne({ premier: true });
    if (ok) { finChargement(); planifier(); return; }
    if (!etat.modele && !sync.versionEnErreur) sync.mode = null;
    if (sync.versionEnErreur) { finChargement(); planifier(); return; }
  }
  // 3. Sinon : « Connecter mon fichier Excel » avec une zone de dépôt
  finChargement();
  definirEtat(etatNominal());
}
function finChargement() {
  if (!etat.chargement) return;
  etat.chargement = false;
  if (!etat.modele) rendrePage();
}

function installerEcouteurs() {
  window.addEventListener('hashchange', function () {
    fermerFeuille();
    rendreTout({ conserver: false });
    const titre = document.getElementById('titre-page');
    if (titre) titre.focus({ preventScroll: true });
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && sync.active && (sync.mode === 'direct' || sync.mode === 'enligne')) {
      verifier({}).then(function () { planifier(); });
    }
  });
  window.addEventListener('online', function () { if (sync.active) verifier({}).then(function () { planifier(); }); });
  document.getElementById('selecteur-fichier').addEventListener('change', function (ev) {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (f) importerFichier(f);
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') fermerFeuille(); });
  document.querySelector('.lien-evitement').addEventListener('click', function (ev) {
    ev.preventDefault();
    const titre = document.getElementById('titre-page') || document.getElementById('contenu');
    titre.focus();
  });
  // Glisser-déposer : connecté en direct si le navigateur le permet (getAsFileSystemHandle)
  const voile = document.getElementById('voile-depot');
  let profondeur = 0;
  const contientFichier = function (ev) { return ev.dataTransfer && Array.prototype.indexOf.call(ev.dataTransfer.types || [], 'Files') >= 0; };
  document.addEventListener('dragenter', function (ev) { if (!contientFichier(ev)) return; ev.preventDefault(); profondeur++; voile.classList.add('visible'); });
  document.addEventListener('dragover', function (ev) { if (!contientFichier(ev)) return; ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; });
  document.addEventListener('dragleave', function (ev) { if (!contientFichier(ev)) return; profondeur = Math.max(0, profondeur - 1); if (!profondeur) voile.classList.remove('visible'); });
  document.addEventListener('drop', function (ev) {
    if (!contientFichier(ev)) return;
    ev.preventDefault();
    profondeur = 0;
    voile.classList.remove('visible');
    const elements = Array.prototype.filter.call(ev.dataTransfer.items || [], function (i) { return i.kind === 'file'; });
    const element = elements[0];
    const fichier = element ? element.getAsFile() : (ev.dataTransfer.files && ev.dataTransfer.files[0]);
    if (!fichier) return;
    if (sync.fsa && element && typeof element.getAsFileSystemHandle === 'function') {
      element.getAsFileSystemHandle().then(function (h) {
        if (h && h.kind === 'file') utiliserPoignee(h); else importerFichier(fichier);
      }).catch(function () { importerFichier(fichier); });
    } else importerFichier(fichier);
  });
  // Menu : se replie en rail quand le curseur le quitte
  const menu = document.getElementById('menu');
  menu.addEventListener('mouseleave', function () { menu.classList.remove('ouvert'); });
}

function demarrer() {
  appliquerTheme(lirePreference('theme', CONFIG.themeParDefaut), false);
  document.documentElement.classList.remove('anti-cadre');
  initialiserFond();
  installerEcouteurs();
  rendreTout({ conserver: false });
  setInterval(majTempsRelatifs, 1000);
  lancerChargement();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
else demarrer();

})();
</script>
